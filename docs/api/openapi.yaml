openapi: 3.1.0
info:
  title: LESta API
  version: v1
  description: >
    The LESta panel's public API. Every call acts as the user who owns the API token, narrowed by the
    token's abilities and, optionally, to one account. Tokens are created under Settings, API tokens,
    and are sent only in the Authorization header. See the vault note "Tenant and Admin API Design".
servers:
  - url: /api/v1
security:
  - apiToken: []
paths:
  /user:
    get:
      operationId: getUser
      summary: The token's user and the token itself
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /accounts:
    get:
      operationId: listAccounts
      summary: The accounts the token reaches
      description: >
        The user's own accounts, the accounts managed by a reseller account the user owns, and only
        the one account when the token is restricted to it.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of accounts
          content:
            application/json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Account'
                  links:
                    $ref: '#/components/schemas/CursorLinks'
                  meta:
                    $ref: '#/components/schemas/CursorMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /operations/{operation}:
    get:
      operationId: getOperation
      summary: A change this token made, and how far the nodes are with it
      description: Only changes made through this token are found; another token's or the panel's are a 404.
      parameters:
        - name: operation
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The operation
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Operation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /accounts/{account}/web-domains:
    get:
      operationId: listWebDomains
      summary: The account's web domains
      description: Needs the web:read ability.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/DomainFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of results
          content:
            application/json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebDomain'
                  links:
                    $ref: '#/components/schemas/CursorLinks'
                  meta:
                    $ref: '#/components/schemas/CursorMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createWebDomain
      summary: Create a web domain
      description: Needs the web:write ability. Refused (403) while the account is suspended.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebDomainCreate'
      responses:
        '202':
          description: Accepted. The nodes apply the change next; poll the operation in Location.
          headers:
            Location:
              description: The operation's address.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [data, operation]
                properties:
                  data:
                    $ref: '#/components/schemas/WebDomain'
                  operation:
                    $ref: '#/components/schemas/OperationRef'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '503':
          $ref: '#/components/responses/NoCapacity'
  /accounts/{account}/web-domains/{webDomain}:

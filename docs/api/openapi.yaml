        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Invalid'
  /admin/mail-domains:
    get:
      operationId: adminListMailDomains
      summary: Every customer's mail domains
      description: Needs the admin:read ability and the mail_domains.view_any permission. Read only; each entry carries account_id.
      parameters:
        - name: filter[account]
          in: query
          required: false
          description: The account's id.
          schema:
            type: string
        - name: filter[domain]
          in: query
          required: false
          description: Exactly this domain.
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of results
          content:
            application/json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MailDomain'
                  links:
                    $ref: '#/components/schemas/CursorLinks'
                  meta:
                    $ref: '#/components/schemas/CursorMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Invalid'
  /admin/databases:
    get:
      operationId: adminListDatabases
      summary: Every customer's databases
      description: Needs the admin:read ability and the tenant_databases.view_any permission. Read only; each entry carries account_id.
      parameters:
        - name: filter[account]
          in: query
          required: false
          description: The account's id.
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of results
          content:
            application/json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Database'
                  links:
                    $ref: '#/components/schemas/CursorLinks'
                  meta:
                    $ref: '#/components/schemas/CursorMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Invalid'
  /admin/cron-jobs:
    get:
      operationId: adminListCronJobs
      summary: Every customer's cron jobs
      description: Needs the admin:read ability and the cron_jobs.view_any permission. Read only; each entry carries account_id.
      parameters:
        - name: filter[account]
          in: query
          required: false
          description: The account's id.
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of results
          content:
            application/json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CronJob'
                  links:
                    $ref: '#/components/schemas/CursorLinks'
                  meta:
                    $ref: '#/components/schemas/CursorMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Invalid'
components:
  securitySchemes:
    apiToken:
      type: http
      scheme: bearer
      description: A personal API token, starting with "lesta_".
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Any 1 to 255 printable characters. A retry with the same key and the same request gets the
        first answer again (with Idempotent-Replayed true) instead of running twice; kept 24 hours,
        per token. Only successful answers are kept.
      schema:
        type: string
        maxLength: 255
    AccountId:
      name: account
      in: path
      required: true
      description: The account's id from GET /accounts.
      schema:
        type: string
    WebDomainId:
      name: webDomain
      in: path
      required: true
      description: The web domain's id.
      schema:
        type: string
        format: uuid
    DnsZoneId:
      name: dnsZone
      in: path
      required: true
      description: The DNS zone's id.
      schema:
        type: string
        format: uuid
    MailDomainId:
      name: mailDomain
      in: path
      required: true
      description: The mail domain's id.
      schema:
        type: string
        format: uuid
    DatabaseId:
      name: database
      in: path
      required: true
      description: The database's id.
      schema:
        type: string
        format: uuid
    CronJobId:
      name: cronJob
      in: path
      required: true
      description: The cron job's id.
      schema:
        type: string
        format: uuid
    BackupId:
      name: backup
      in: path
      required: true
      description: The backup's id.
      schema:
        type: string
        format: uuid
    DnsRecordId:
      name: record
      in: path
      required: true
      description: The record's id.
      schema:
        type: string
        format: uuid
    MailboxId:
      name: mailbox
      in: path
      required: true
      description: The mailbox's id.
      schema:
        type: string
        format: uuid
    PackageId:
      name: package
      in: path
      required: true
      description: The package's id.
      schema:
        type: string
        format: uuid
    NodeId:
      name: node
      in: path
      required: true
      description: The node's id.
      schema:
        type: string
        format: uuid
    NodeBackupId:
      name: backup
      in: path
      required: true
      description: The backup's id.
      schema:
        type: string
        format: uuid
    ResourceType:
      name: resourceType
      in: path
      required: true
      schema:
        type: string
        enum: [web_domains, dns_zones, dns_records, mail_domains, mail_accounts, tenant_databases, cron_jobs]
    DomainFilter:
      name: filter[domain]
      in: query
      required: false
      description: Only the resource with exactly this domain (case does not matter).
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  responses:
    Unauthorized:
      description: The token is missing, unknown, revoked or expired (urn:lesta:problem:invalid-token).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: >
        The token lacks the ability (missing-ability), is restricted to another account
        (account-restricted), the account is suspended and the call changes it (account-suspended),
        the login lacks the platform permission (missing-permission), or the user may not do this
        (about:blank).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such resource here.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Invalid:
      description: The input is invalid (urn:lesta:problem:validation, with errors), or a package limit is reached (urn:lesta:problem:quota-exceeded).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: The Idempotency-Key header is not 1 to 255 printable characters (urn:lesta:problem:invalid-idempotency-key).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    IdempotencyConflict:
      description: The Idempotency-Key was used with another request (idempotency-key-reused), or that request is still running (idempotency-key-in-progress).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NoCapacity:
      description: No server can take the resource right now (urn:lesta:problem:no-capacity).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Too many requests (about:blank), or too many failed tokens from this address (too-many-failed-tokens).
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      description: >
        An RFC 9457 problem document. type is urn:lesta:problem:<name> for the problems the API
        names (invalid-token, too-many-failed-tokens, missing-ability, missing-permission,
        account-restricted, account-suspended, validation, quota-exceeded, no-capacity,
        invalid-idempotency-key, idempotency-key-reused, idempotency-key-in-progress), otherwise
        about:blank with the status's own title.
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          description: Only for urn:lesta:problem:validation, the field errors.
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    User:
      type: object
      required: [id, name, email, token]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        token:
          type: object
          required: [id, name, abilities, account_id, expires_at]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            abilities:
              type: array
              items:
                type: string
                enum: [web:read, web:write, dns:read, dns:write, mail:read, mail:write, databases:read, databases:write, cron:read, cron:write, backups:read, backups:write, usage:read, admin:read, admin:write]
            account_id:
              type: [string, 'null']
              description: The public id of the one account the token is restricted to.
            expires_at:
              type: string
              format: date-time
    Account:
      type: object
      required: [id, name, contact_email, package, is_owner, reseller_account_id, suspended, created_at]
      properties:
        id:
          type: string
          description: The account's public id, used in the account paths.
        name:
          type: string
        contact_email:
          type: [string, 'null']
        package:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, name]
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
        is_owner:
          type: boolean
        reseller_account_id:
          type: [string, 'null']
          description: The public id of the reseller account that manages this one.
        suspended:
          type: boolean
        suspended_at:
          type: [string, 'null']
          format: date-time
        memberships_count:
          type: integer
          description: Only in the admin account calls.
        created_at:
          type: [string, 'null']
          format: date-time
    OperationRef:
      type: object
      required: [id, status, url]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, applied, failed]
        url:
          type: string
    Operation:
      type: object
      required: [id, action, status, steps, created_at]
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
          description: What was done, for example web_domain.created.
        status:
          type: string
          enum: [pending, applied, failed]
          description: failed when any step failed, pending while any step is on its way, applied when all are done.
        steps:
          type: array
          items:
            type: object
            required: [capability, verb, status, errors, completed_at]
            properties:
              capability:
                type: string
              verb:
                type: string
                enum: [create, update, delete]
              status:
                type: string
                enum: [pending, dispatched, applied, already_applied, rejected, failed, degraded]
              errors:
                type: array
                items:
                  type: object
                  required: [code, message]
                  properties:
                    code:
                      type: string
                    message:
                      type: string
              completed_at:
                type: [string, 'null']
                format: date-time
        created_at:
          type: [string, 'null']
          format: date-time
    WebDomainCreate:
      type: object
      required: [domain]
      properties:
        domain:
          type: string
        aliases:
          type: array
          items:
            type: string
        web_template:
          type: string
        web_server:
          type: string
          enum: [nginx, apache]
        php_version:
          type: [string, 'null']
        ssl_mode:
          type: string
          enum: [none, manual, lets_encrypt]
    WebDomainUpdate:
      type: object
      properties:
        domain:
          type: string
        aliases:
          type: array
          description: Replaces all aliases.
          items:
            type: string
        web_template:
          type: string
        web_server:
          type: string
          enum: [nginx, apache]
        php_version:
          type: [string, 'null']
        ssl_mode:
          type: string
          enum: [none, manual, lets_encrypt]
        waf_mode:
          type: string
          enum: ['off', detect, block]
        waf_preset:
          type: string
        waf_excluded_rules:
          type: array
          items:
            type: integer
        hotlink_protection:
          type: boolean
        hotlink_allowed_hosts:
          type: array
          items:
            type: string
    DnsZoneCreate:
      type: object
      required: [domain]
      properties:
        domain:
          type: string
        ttl:
          type: integer
          minimum: 60
          maximum: 604800
    DnsZoneUpdate:
      type: object
      properties:
        domain:
          type: string
        ttl:
          type: integer
          minimum: 60
          maximum: 604800
    DnsRecordCreate:
      type: object
      required: [name, type, value]
      properties:
        name:
          type: string
          description: The name inside the zone, for example www, or @ for the zone itself.
        type:
          type: string
          enum: [A, AAAA, CNAME, MX, TXT, NS, SRV, CAA, PTR]
        priority:
          type: [integer, 'null']
          description: Required for MX and SRV, ignored otherwise.
        value:
          type: string
    DnsRecordUpdate:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [A, AAAA, CNAME, MX, TXT, NS, SRV, CAA, PTR]
        priority:
          type: [integer, 'null']
        value:
          type: string
    MailDomainCreate:
      type: object
      required: [domain]
      properties:
        domain:
          type: string
        antivirus_enabled:
          type: boolean
        antispam_enabled:
          type: boolean
        dkim_enabled:
          type: boolean
    MailDomainUpdate:
      type: object
      properties:
        antivirus_enabled:
          type: boolean
        antispam_enabled:
          type: boolean
        dkim_enabled:
          type: boolean
        catchall_email:
          type: [string, 'null']
          description: A mailbox on this domain that gets mail for unknown addresses, or null for none.
    MailboxCreate:
      type: object
      required: [local_part]
      properties:
        local_part:
          type: string
        quota_mb:
          type: [integer, 'null']
        forward_to:
          type: [string, 'null']
        forward_only:
          type: boolean
        autoreply_enabled:
          type: boolean
        autoreply_message:
          type: [string, 'null']
        spam_sensitivity:
          type: string
          enum: ['off', low, medium, high]
          description: How readily spam goes to the Junk folder (from a score of 8, 5 or 3; off never). Needs antispam on the mail domain.
        spam_allow:
          type: array
          description: Addresses or domains whose mail is never moved to Junk.
          items:
            type: string
        spam_block:
          type: array
          description: Addresses or domains whose mail is deleted without delivery.
          items:
            type: string
    MailboxUpdate:
      type: object
      properties:
        quota_mb:
          type: [integer, 'null']
        forward_to:
          type: [string, 'null']
        forward_only:
          type: boolean
        autoreply_enabled:
          type: boolean
        autoreply_message:
          type: [string, 'null']
        spam_sensitivity:
          type: string
          enum: ['off', low, medium, high]
          description: How readily spam goes to the Junk folder (from a score of 8, 5 or 3; off never). Needs antispam on the mail domain.
        spam_allow:
          type: array
          description: Addresses or domains whose mail is never moved to Junk.
          items:
            type: string
        spam_block:
          type: array
          description: Addresses or domains whose mail is deleted without delivery.
          items:
            type: string
    MailboxWithPassword:
      allOf:
        - $ref: '#/components/schemas/Mailbox'
        - type: object
          required: [password]
          properties:
            password:
              type: [string, 'null']
              description: Shown in this answer only. Null in a replayed answer.
    DatabaseCreate:
      type: object
      required: [label]
      properties:
        label:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,32}$'
    DatabaseWithPassword:
      allOf:
        - $ref: '#/components/schemas/Database'
        - type: object
          required: [password]
          properties:
            password:
              type: [string, 'null']
              description: Shown in this answer only. Null in a replayed answer.
    CronJobCreate:
      type: object
      required: [command]
      properties:
        minute:
          type: string
        hour:
          type: string
        day_of_month:
          type: string
        month:
          type: string
        day_of_week:
          type: string
        command:
          type: string
          maxLength: 1024
    CronJobUpdate:
      type: object
      properties:
        minute:
          type: string
        hour:
          type: string
        day_of_month:
          type: string
        month:
          type: string
        day_of_week:
          type: string
        command:
          type: string
          maxLength: 1024
    BackupCreate:
      type: object
      required: [parts]
      properties:
        parts:
          type: array
          minItems: 1
          items:
            type: string
            enum: [files, databases, mail]
        node:
          type: string
          description: The node's name, as backups show it. May be left out when the account has data on one node only.
        label:
          type: [string, 'null']
          maxLength: 100
    BackupRestore:
      type: object
      required: [parts, confirm]
      properties:
        parts:
          type: array
          minItems: 1
          items:
            type: string
            enum: [files, databases, mail]
        confirm:
          type: boolean
          const: true
          description: The restore overwrites the current data of these parts.
    AdminAccountCreate:
      type: object
      required: [name, package, owner_name, owner_email]
      properties:
        name:
          type: string
        contact_email:
          type: [string, 'null']
          description: The owner's e-mail when left out.
        package:
          type: string
          format: uuid
          description: An active package's id.
        owner_name:
          type: string
          description: Used only when the owner has no login yet.
        owner_email:
          type: string
    AdminAccountUpdate:
      type: object
      properties:
        name:
          type: string
        contact_email:
          type: [string, 'null']
        package:
          type: string
          format: uuid
    AdminAccountDelete:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: string
          description: The account's id, to confirm.
    AdminAssignReseller:
      type: object
      required: [reseller_account_id]
      properties:
        reseller_account_id:
          type: string
    Package:
      type: object
      required: [id, name, description, is_active, limits, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        is_active:
          type: boolean
        limits:
          type: object
          description: One entry per resource type. configured false means none may be created; limit null means unlimited.
          additionalProperties:
            type: object
            required: [configured, limit]
            properties:
              configured:
                type: boolean
              limit:
                type: [integer, 'null']
        accounts_count:
          type: integer
        created_at:
          type: [string, 'null']
          format: date-time
    PackageCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: [string, 'null']
        is_active:
          type: boolean
          description: false when left out, as in the panel.
    PackageUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: [string, 'null']
        is_active:
          type: boolean
    PackageLimit:
      type: object
      properties:
        limit_value:
          type: [integer, 'null']
          minimum: 0
          description: null for unlimited.
    Node:
      type: object
      required: [id, name, hostname, enrollment_status, agent_reachable, ping, services, backups_scheduled, suspended, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        hostname:
          type: string
        mail_hostname:
          type: [string, 'null']
        enrollment_status:
          type: string
        agent_version:
          type: [string, 'null']
        agent_reachable:
          type: boolean
        last_seen_at:
          type: [string, 'null']
          format: date-time
        ping:
          type: object
          properties:
            ok:
              type: [boolean, 'null']
            ms:
              type: [number, 'null']
            at:
              type: [string, 'null']
              format: date-time
        services:
          type: array
          items:
            type: object
            required: [name, state]
            properties:
              name:
                type: string
              state:
                type: string
        capabilities:
          type: array
          items:
            type: object
            required: [capability, status]
            properties:
              capability:
                type: string
              status:
                type: string
                description: suspended, unknown when the agent cannot be reached, otherwise the reported status.
              last_seen_at:
                type: [string, 'null']
                format: date-time
        backups_scheduled:
          type: boolean
        suspended:
          type: boolean
        suspended_at:
          type: [string, 'null']
          format: date-time
        suspension_source:
          type: [string, 'null']
        created_at:
          type: [string, 'null']
          format: date-time
    NodeBackup:
      description: A whole-node backup. Never its encryption key.
      type: object
      required: [id, label, node, status, error, included_capabilities, size_bytes, completed_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: [string, 'null']
        node:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        status:
          type: string
          enum: [running, ready, failed]
        error:
          type: [string, 'null']
        included_capabilities:
          type: array
          items:
            type: string
        size_bytes:
          type: [integer, 'null']
        completed_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: [string, 'null']
          format: date-time
    NodeBackupCreate:
      type: object
      required: [node]
      properties:
        node:
          type: string
          format: uuid
        label:
          type: [string, 'null']
    Suspension:
      type: object
      required: [suspended, suspended_at, suspension_source]
      properties:
        suspended:
          type: boolean
        suspended_at:
          type: [string, 'null']
          format: date-time
        suspension_source:
          type: [string, 'null']
          enum: [manual, cascade, null]
          description: cascade when the account was suspended, manual when this resource itself was.
    Provisioning:
      description: The latest change sent to the node. Null when nothing was ever sent.
      oneOf:
        - type: 'null'
        - type: object
          required: [status, completed_at]
          properties:
            status:
              type: string
              enum: [pending, dispatched, applied, already_applied, rejected, failed, degraded]
            completed_at:
              type: [string, 'null']
              format: date-time
    WebDomain:
      allOf:
        - $ref: '#/components/schemas/Suspension'
        - type: object
          required: [id, domain, aliases, web_template, web_server, php_version, ssl_mode, certificate, waf_mode, waf_preset, waf_excluded_rules, hotlink_protection, hotlink_allowed_hosts, provisioning, created_at]
          properties:
            id:
              type: string
              format: uuid
            account_id:
              type: string
              description: Only in the admin lists.
            domain:
              type: string
            aliases:
              type: array
              items:
                type: string
            web_template:
              type: string
            web_server:
              type: string
            php_version:
              type: [string, 'null']
            ssl_mode:
              type: string
            certificate:
              type: object
              required: [issued_at, expires_at, last_error]
              properties:
                issued_at:
                  type: [string, 'null']
                  format: date-time
                expires_at:
                  type: [string, 'null']
                  format: date-time
                last_error:
                  type: [string, 'null']
            waf_mode:
              type: string
            waf_preset:
              type: string
            waf_excluded_rules:
              type: array
              items:
                type: integer
            hotlink_protection:
              type: boolean
            hotlink_allowed_hosts:
              type: array
              items:
                type: string
            provisioning:
              $ref: '#/components/schemas/Provisioning'
            created_at:
              type: [string, 'null']
              format: date-time
    DnsZone:
      allOf:
        - $ref: '#/components/schemas/Suspension'
        - type: object
          required: [id, domain, ttl, records_count, provisioning, created_at]
          properties:
            id:
              type: string
              format: uuid
            account_id:
              type: string
              description: Only in the admin lists.
            domain:
              type: string
            ttl:
              type: integer
            records_count:
              type: integer
            provisioning:
              $ref: '#/components/schemas/Provisioning'
            created_at:
              type: [string, 'null']
              format: date-time
    DnsRecord:
      allOf:
        - $ref: '#/components/schemas/Suspension'
        - type: object
          required: [id, name, type, priority, value, created_at]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            type:
              type: string
            priority:
              type: [integer, 'null']
            value:
              type: string
            created_at:
              type: [string, 'null']
              format: date-time
    MailDomain:
      allOf:
        - $ref: '#/components/schemas/Suspension'
        - type: object
          required: [id, domain, antivirus_enabled, antispam_enabled, dkim_enabled, dkim_selector, catchall_email, accounts_count, provisioning, created_at]
          properties:
            id:
              type: string
              format: uuid
            account_id:
              type: string
              description: Only in the admin lists.
            domain:
              type: string
            antivirus_enabled:
              type: boolean
            antispam_enabled:
              type: boolean
            dkim_enabled:
              type: boolean
            dkim_selector:
              type: string
            catchall_email:
              type: [string, 'null']
            accounts_count:
              type: integer
              description: How many mailboxes the domain has.
            provisioning:
              $ref: '#/components/schemas/Provisioning'
            created_at:
              type: [string, 'null']
              format: date-time
    Mailbox:
      description: A mailbox. Never its password.
      allOf:
        - $ref: '#/components/schemas/Suspension'
        - type: object
          required: [id, local_part, address, quota_mb, forward_to, forward_only, autoreply_enabled, autoreply_message, created_at]
          properties:
            id:
              type: string
              format: uuid
            local_part:
              type: string
            address:
              type: string
            quota_mb:
              type: [integer, 'null']
            forward_to:
              type: [string, 'null']
            forward_only:
              type: boolean
            autoreply_enabled:
              type: boolean
            autoreply_message:
              type: [string, 'null']
            spam_sensitivity:
              type: string
              enum: ['off', low, medium, high]
              description: How readily spam goes to the Junk folder (from a score of 8, 5 or 3; off never). Needs antispam on the mail domain.
            spam_allow:
              type: array
              description: Addresses or domains whose mail is never moved to Junk.
              items:
                type: string
            spam_block:
              type: array
              description: Addresses or domains whose mail is deleted without delivery.
              items:
                type: string
            created_at:
              type: [string, 'null']
              format: date-time
    Database:
      description: A customer database. Never its password.
      allOf:
        - $ref: '#/components/schemas/Suspension'
        - type: object
          required: [id, label, database_name, database_user, provisioning, created_at]
          properties:
            id:
              type: string
              format: uuid
            account_id:
              type: string
              description: Only in the admin lists.
            label:
              type: string
            database_name:
              type: string
            database_user:
              type: string
            provisioning:
              $ref: '#/components/schemas/Provisioning'
            created_at:
              type: [string, 'null']
              format: date-time
    CronJob:
      allOf:
        - $ref: '#/components/schemas/Suspension'
        - type: object
          required: [id, minute, hour, day_of_month, month, day_of_week, command, provisioning, created_at]
          properties:
            id:
              type: string
              format: uuid
            account_id:
              type: string
              description: Only in the admin lists.
            minute:
              type: string
            hour:
              type: string
            day_of_month:
              type: string
            month:
              type: string
            day_of_week:
              type: string
            command:
              type: string
            provisioning:
              $ref: '#/components/schemas/Provisioning'
            executions:
              description: Only when one cron job is fetched, the last 20 runs, newest first.
              type: array
              items:
                type: object
                required: [started_at, finished_at, exit_code, output]
                properties:
                  started_at:
                    type: string
                    format: date-time
                  finished_at:
                    type: string
                    format: date-time
                  exit_code:
                    type: integer
                  output:
                    type: string
            created_at:
              type: [string, 'null']
              format: date-time
    Backup:
      description: An account backup. Never its encryption key.
      type: object
      required: [id, label, kind, node, status, error, parts, size_bytes, skipped, remote, last_restore, completed_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: [string, 'null']
        kind:
          type: string
          enum: [manual, scheduled, before_restore, imported]
        node:
          type: string
          description: The name of the node the backup was taken on.
        status:
          type: string
          enum: [running, ready, failed]
        error:
          type: [string, 'null']
        parts:
          type: array
          items:
            type: string
        size_bytes:
          type: [integer, 'null']
        skipped:
          type: array
          description: What the backup could not include, and why.
        remote:
          description: The copy to the account's own storage. Null when none was made.
          oneOf:
            - type: 'null'
            - type: object
              required: [status, key, at, error]
              properties:
                status:
                  type: string
                  enum: [copying, copied, failed]
                key:
                  type: [string, 'null']
                at:
                  type: [string, 'null']
                  format: date-time
                error:
                  type: [string, 'null']
        last_restore:
          description: The latest restore from this backup. Null when it was never restored.
          oneOf:
            - type: 'null'
            - type: object
              required: [status, at, restored, skipped, error]
              properties:
                status:
                  type: string
                  enum: [running, applied, failed]
                at:
                  type: [string, 'null']
                  format: date-time
                restored:
                  type: array
                skipped:
                  type: array
                error:
                  type: [string, 'null']
        completed_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: [string, 'null']
          format: date-time
    UsageResource:
      type: object
      required: [type, label]
      properties:
        type:
          type: string
          enum: [web_domain, mail_account, tenant_database, unknown]
        label:
          type: string
    UsageSnapshot:
      description: One collection cycle for one resource. Disk is the size at that moment; requests and bytes sent are what happened since the previous cycle.
      type: object
      required: [id, resource, disk_bytes, request_count, bytes_sent, collected_at]
      properties:
        id:
          type: string
          format: uuid
        resource:
          $ref: '#/components/schemas/UsageResource'
        disk_bytes:
          type: [integer, 'null']
        request_count:
          type: [integer, 'null']
        bytes_sent:
          type: [integer, 'null']
        collected_at:
          type: string
          format: date-time
    UsageMonth:
      description: One month for one resource.
      type: object
      required: [id, resource, period, disk_bytes_last, request_count_sum, bytes_sent_sum]
      properties:
        id:
          type: string
          format: uuid
        resource:
          $ref: '#/components/schemas/UsageResource'
        period:
          type: string
          description: The month, as YYYY-MM.
        disk_bytes_last:
          type: [integer, 'null']
        request_count_sum:
          type: [integer, 'null']
        bytes_sent_sum:
          type: [integer, 'null']
    CursorLinks:
      type: object
      properties:
        first:
          type: [string, 'null']
        last:
          type: [string, 'null']
        prev:
          type: [string, 'null']
        next:
          type: [string, 'null']
    CursorMeta:
      type: object
      properties:
        path:
          type: string
        per_page:
          type: integer
        next_cursor:
          type: [string, 'null']
        prev_cursor:
          type: [string, 'null']

      operationId: listMonthlyUsage
      summary: Usage per resource and month, newest first
      description: Needs the usage:read ability.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of results
          content:
            application/json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UsageMonth'
                  links:
                    $ref: '#/components/schemas/CursorLinks'
                  meta:

components:
  securitySchemes:
    apiToken:
      type: http
      scheme: bearer
      description: A personal API token, starting with "lesta_".
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Any 1 to 255 printable characters. A retry with the same key and the same request gets the
        first answer again (with Idempotent-Replayed true) instead of running twice; kept 24 hours,
        per token. Only successful answers are kept.
      schema:
        type: string
        maxLength: 255
    AccountId:
      name: account
      in: path
      required: true
      description: The account's id from GET /accounts.
      schema:
        type: string
    WebDomainId:
      name: webDomain
      in: path
      required: true
      description: The web domain's id.
      schema:
        type: string
        format: uuid
    DnsZoneId:
      name: dnsZone
      in: path
      required: true
      description: The DNS zone's id.
      schema:
        type: string
        format: uuid
    MailDomainId:
      name: mailDomain
      in: path
      required: true
      description: The mail domain's id.
      schema:
        type: string
        format: uuid
    DatabaseId:
      name: database
      in: path
      required: true
      description: The database's id.
      schema:
        type: string
        format: uuid
    CronJobId:
      name: cronJob
      in: path
      required: true
      description: The cron job's id.
      schema:
        type: string
        format: uuid
    BackupId:
      name: backup
      in: path
      required: true
      description: The backup's id.
      schema:
        type: string
        format: uuid
    DnsRecordId:
      name: record
      in: path
      required: true
      description: The record's id.
      schema:
        type: string
        format: uuid
    MailboxId:
      name: mailbox
      in: path
      required: true
      description: The mailbox's id.
      schema:
        type: string
        format: uuid
    DomainFilter:
      name: filter[domain]
      in: query
      required: false
      description: Only the resource with exactly this domain (case does not matter).
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  responses:
    Unauthorized:
      description: The token is missing, unknown or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    Forbidden:
      description: The token lacks the ability, is restricted to another account, or the user cannot see this account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    NotFound:
      description: No such resource in this account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    Invalid:
      description: The input is invalid, or a package limit is reached.
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message:
                type: string
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
    IdempotencyConflict:
      description: The Idempotency-Key was used with another request, or that request is still running.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    NoCapacity:
      description: No server can take the resource right now.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    TooManyRequests:
      description: Too many requests, or too many failed tokens from this address.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
  schemas:
    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string
    User:
      type: object
      required: [id, name, email, token]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        token:
          type: object
          required: [id, name, abilities, account_id, expires_at]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            abilities:
              type: array
              items:
                type: string
                enum: [web:read, web:write, dns:read, dns:write, mail:read, mail:write, databases:read, databases:write, cron:read, cron:write, backups:read, backups:write, usage:read, admin:read, admin:write]
            account_id:
              type: [string, 'null']
              description: The public id of the one account the token is restricted to.
            expires_at:
              type: string
              format: date-time
    Account:
      type: object
      required: [id, name, contact_email, package, is_owner, reseller_account_id, suspended, created_at]
      properties:
        id:
          type: string
          description: The account's public id, used in the account paths.
        name:
          type: string
        contact_email:
          type: [string, 'null']
        package:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, name]
              properties:
                id:
                  type: integer
                name:
                  type: string
        is_owner:
          type: boolean
        reseller_account_id:
          type: [string, 'null']
          description: The public id of the reseller account that manages this one.
        suspended:
          type: boolean
        created_at:
          type: [string, 'null']
          format: date-time
    OperationRef:
      type: object
      required: [id, status, url]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, applied, failed]
        url:
          type: string
    Operation:
      type: object
      required: [id, action, status, steps, created_at]
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
          description: What was done, for example web_domain.created.
        status:
          type: string
          enum: [pending, applied, failed]
          description: failed when any step failed, pending while any step is on its way, applied when all are done.
        steps:
          type: array
          items:
            type: object
            required: [capability, verb, status, errors, completed_at]
            properties:
              capability:
                type: string
              verb:
                type: string
                enum: [create, update, delete]
              status:
                type: string
                enum: [pending, dispatched, applied, already_applied, rejected, failed, degraded]
              errors:
                type: array
                items:
                  type: object
                  required: [code, message]
                  properties:
                    code:
                      type: string
                    message:
                      type: string
              completed_at:
                type: [string, 'null']
                format: date-time
        created_at:
          type: [string, 'null']
          format: date-time
    WebDomainCreate:
      type: object
      required: [domain]
      properties:
        domain:
          type: string
        aliases:
          type: array
          items:
            type: string
        web_template:
          type: string
        web_server:
          type: string
          enum: [nginx, apache]
        php_version:
          type: [string, 'null']
        ssl_mode:
          type: string
          enum: [none, manual, lets_encrypt]
    WebDomainUpdate:
      type: object
      properties:
        domain:
          type: string
        aliases:
          type: array
          description: Replaces all aliases.
          items:
            type: string
        web_template:
          type: string
        web_server:
          type: string
          enum: [nginx, apache]
        php_version:
          type: [string, 'null']
        ssl_mode:
          type: string
          enum: [none, manual, lets_encrypt]
        waf_mode:
          type: string
          enum: ['off', detect, block]
        waf_preset:
          type: string
        waf_excluded_rules:
          type: array
          items:
            type: integer
        hotlink_protection:
          type: boolean
        hotlink_allowed_hosts:
          type: array
          items:
            type: string
    DnsZoneCreate:
      type: object
      required: [domain]
      properties:
        domain:
          type: string
        ttl:
          type: integer
          minimum: 60
          maximum: 604800
    DnsZoneUpdate:
      type: object
      properties:
        domain:
          type: string
        ttl:
          type: integer
          minimum: 60
          maximum: 604800
    DnsRecordCreate:
      type: object
      required: [name, type, value]
      properties:
        name:
          type: string
          description: The name inside the zone, for example www, or @ for the zone itself.
        type:
          type: string
          enum: [A, AAAA, CNAME, MX, TXT, NS, SRV, CAA, PTR]
        priority:
          type: [integer, 'null']
          description: Required for MX and SRV, ignored otherwise.
        value:
          type: string
    DnsRecordUpdate:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [A, AAAA, CNAME, MX, TXT, NS, SRV, CAA, PTR]
        priority:
          type: [integer, 'null']
        value:
          type: string
    MailDomainCreate:
      type: object
      required: [domain]
      properties:
        domain:
          type: string
        antivirus_enabled:
          type: boolean
        antispam_enabled:
          type: boolean
        dkim_enabled:
          type: boolean
    MailDomainUpdate:
      type: object
      properties:
        antivirus_enabled:
          type: boolean
        antispam_enabled:
          type: boolean
        dkim_enabled:
          type: boolean
        catchall_email:
          type: [string, 'null']
          description: A mailbox on this domain that gets mail for unknown addresses, or null for none.
    MailboxCreate:
      type: object
      required: [local_part]
      properties:
        local_part:
          type: string
        quota_mb:
          type: [integer, 'null']
        forward_to:
          type: [string, 'null']
        forward_only:
          type: boolean
        autoreply_enabled:
          type: boolean
        autoreply_message:
          type: [string, 'null']
    MailboxUpdate:
      type: object
      properties:
        quota_mb:
          type: [integer, 'null']
        forward_to:
          type: [string, 'null']
        forward_only:
          type: boolean
        autoreply_enabled:
          type: boolean
        autoreply_message:
          type: [string, 'null']
    MailboxWithPassword:
      allOf:
        - $ref: '#/components/schemas/Mailbox'
        - type: object
          required: [password]
          properties:
            password:
              type: [string, 'null']
              description: Shown in this answer only. Null in a replayed answer.
    DatabaseCreate:
      type: object
      required: [label]
      properties:
        label:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,32}$'
    DatabaseWithPassword:
      allOf:
        - $ref: '#/components/schemas/Database'
        - type: object
          required: [password]
          properties:
            password:
              type: [string, 'null']
              description: Shown in this answer only. Null in a replayed answer.
    CronJobCreate:
      type: object
      required: [command]
      properties:
        minute:
          type: string
        hour:
          type: string
        day_of_month:
          type: string
        month:
          type: string
        day_of_week:
          type: string
        command:
          type: string
          maxLength: 1024
    CronJobUpdate:
      type: object
      properties:
        minute:
          type: string
        hour:
          type: string
        day_of_month:
          type: string
        month:
          type: string
        day_of_week:
          type: string
        command:
          type: string
          maxLength: 1024
    BackupCreate:
      type: object
      required: [parts]
      properties:
        parts:
          type: array
          minItems: 1
          items:
            type: string
            enum: [files, databases, mail]
        node:
          type: string
          description: The node's name, as backups show it. May be left out when the account has data on one node only.
        label:
          type: [string, 'null']
          maxLength: 100
    BackupRestore:
      type: object
      required: [parts, confirm]
      properties:
        parts:
          type: array
          minItems: 1
          items:
            type: string
            enum: [files, databases, mail]
        confirm:
          type: boolean
          const: true
          description: The restore overwrites the current data of these parts.
    Suspension:
      type: object
      required: [suspended, suspended_at, suspension_source]
      properties:
        suspended:
          type: boolean
        suspended_at:
          type: [string, 'null']
          format: date-time
        suspension_source:
          type: [string, 'null']
          enum: [manual, cascade, null]
          description: cascade when the account was suspended, manual when this resource itself was.
    Provisioning:
      description: The latest change sent to the node. Null when nothing was ever sent.
      oneOf:
        - type: 'null'
        - type: object
          required: [status, completed_at]
          properties:
            status:
              type: string
              enum: [pending, dispatched, applied, already_applied, rejected, failed, degraded]
            completed_at:
              type: [string, 'null']
              format: date-time
    WebDomain:
      allOf:
        - $ref: '#/components/schemas/Suspension'
        - type: object
          required: [id, domain, aliases, web_template, web_server, php_version, ssl_mode, certificate, waf_mode, waf_preset, waf_excluded_rules, hotlink_protection, hotlink_allowed_hosts, provisioning, created_at]
          properties:
            id:
              type: string
              format: uuid
            domain:
              type: string
            aliases:
              type: array
              items:
                type: string
            web_template:
              type: string
            web_server:
              type: string
            php_version:
              type: [string, 'null']
            ssl_mode:
              type: string
            certificate:
              type: object
              required: [issued_at, expires_at, last_error]
              properties:
                issued_at:
                  type: [string, 'null']
                  format: date-time
                expires_at:
                  type: [string, 'null']
                  format: date-time
                last_error:
                  type: [string, 'null']
            waf_mode:
              type: string
            waf_preset:
              type: string
            waf_excluded_rules:
              type: array
              items:
                type: integer
            hotlink_protection:
              type: boolean
            hotlink_allowed_hosts:
              type: array
              items:
                type: string
            provisioning:
              $ref: '#/components/schemas/Provisioning'
            created_at:
              type: [string, 'null']
              format: date-time
    DnsZone:
      allOf:
        - $ref: '#/components/schemas/Suspension'
        - type: object
          required: [id, domain, ttl, records_count, provisioning, created_at]
          properties:
            id:
              type: string
              format: uuid
            domain:
              type: string
            ttl:
              type: integer
            records_count:
              type: integer
            provisioning:
              $ref: '#/components/schemas/Provisioning'
            created_at:
              type: [string, 'null']
              format: date-time
    DnsRecord:
      allOf:
        - $ref: '#/components/schemas/Suspension'
        - type: object
          required: [id, name, type, priority, value, created_at]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            type:
              type: string
            priority:
              type: [integer, 'null']
            value:
              type: string
            created_at:
              type: [string, 'null']
              format: date-time
    MailDomain:
      allOf:
        - $ref: '#/components/schemas/Suspension'
        - type: object
          required: [id, domain, antivirus_enabled, antispam_enabled, dkim_enabled, dkim_selector, catchall_email, accounts_count, provisioning, created_at]
          properties:
            id:
              type: string
              format: uuid
            domain:
              type: string
            antivirus_enabled:
              type: boolean
            antispam_enabled:
              type: boolean
            dkim_enabled:
              type: boolean
            dkim_selector:
              type: string
            catchall_email:
              type: [string, 'null']
            accounts_count:
              type: integer
              description: How many mailboxes the domain has.
            provisioning:
              $ref: '#/components/schemas/Provisioning'
            created_at:
              type: [string, 'null']
              format: date-time
    Mailbox:
      description: A mailbox. Never its password.
      allOf:
        - $ref: '#/components/schemas/Suspension'
        - type: object
          required: [id, local_part, address, quota_mb, forward_to, forward_only, autoreply_enabled, autoreply_message, created_at]
          properties:
            id:
              type: string
              format: uuid
            local_part:
              type: string
            address:
              type: string
            quota_mb:
              type: [integer, 'null']
            forward_to:
              type: [string, 'null']
            forward_only:
              type: boolean
            autoreply_enabled:
              type: boolean
            autoreply_message:
              type: [string, 'null']
            created_at:
              type: [string, 'null']
              format: date-time
    Database:
      description: A customer database. Never its password.
      allOf:
        - $ref: '#/components/schemas/Suspension'
        - type: object
          required: [id, label, database_name, database_user, provisioning, created_at]
          properties:
            id:
              type: string
              format: uuid
            label:
              type: string
            database_name:
              type: string
            database_user:
              type: string
            provisioning:
              $ref: '#/components/schemas/Provisioning'
            created_at:
              type: [string, 'null']
              format: date-time
    CronJob:
      allOf:
        - $ref: '#/components/schemas/Suspension'
        - type: object
          required: [id, minute, hour, day_of_month, month, day_of_week, command, provisioning, created_at]
          properties:
            id:
              type: string
              format: uuid
            minute:
              type: string
            hour:
              type: string
            day_of_month:
              type: string
            month:
              type: string
            day_of_week:
              type: string
            command:
              type: string
            provisioning:
              $ref: '#/components/schemas/Provisioning'
            executions:
              description: Only when one cron job is fetched, the last 20 runs, newest first.
              type: array
              items:
                type: object
                required: [started_at, finished_at, exit_code, output]
                properties:
                  started_at:
                    type: string
                    format: date-time
                  finished_at:
                    type: string
                    format: date-time
                  exit_code:
                    type: integer
                  output:
                    type: string
            created_at:
              type: [string, 'null']
              format: date-time
    Backup:
      description: An account backup. Never its encryption key.
      type: object
      required: [id, label, kind, node, status, error, parts, size_bytes, skipped, remote, last_restore, completed_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: [string, 'null']
        kind:
          type: string
          enum: [manual, scheduled, before_restore, imported]
        node:
          type: string
          description: The name of the node the backup was taken on.
        status:
          type: string
          enum: [running, ready, failed]
        error:
          type: [string, 'null']
        parts:
          type: array
          items:
            type: string
        size_bytes:
          type: [integer, 'null']
        skipped:
          type: array
          description: What the backup could not include, and why.
        remote:
          description: The copy to the account's own storage. Null when none was made.
          oneOf:
            - type: 'null'
            - type: object
              required: [status, key, at, error]
              properties:
                status:
                  type: string
                  enum: [copying, copied, failed]
                key:
                  type: [string, 'null']
                at:
                  type: [string, 'null']
                  format: date-time
                error:
                  type: [string, 'null']
        last_restore:
          description: The latest restore from this backup. Null when it was never restored.
          oneOf:
            - type: 'null'
            - type: object
              required: [status, at, restored, skipped, error]
              properties:
                status:
                  type: string
                  enum: [running, applied, failed]
                at:
                  type: [string, 'null']
                  format: date-time
                restored:
                  type: array
                skipped:
                  type: array
                error:
                  type: [string, 'null']
        completed_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: [string, 'null']
          format: date-time
    UsageResource:
      type: object
      required: [type, label]
      properties:
        type:
          type: string
          enum: [web_domain, mail_account, tenant_database, unknown]
        label:
          type: string
    UsageSnapshot:
      description: One collection cycle for one resource. Disk is the size at that moment; requests and bytes sent are what happened since the previous cycle.
      type: object
      required: [id, resource, disk_bytes, request_count, bytes_sent, collected_at]
      properties:
        id:
          type: string
          format: uuid
        resource:
          $ref: '#/components/schemas/UsageResource'
        disk_bytes:
          type: [integer, 'null']
        request_count:
          type: [integer, 'null']
        bytes_sent:
          type: [integer, 'null']
        collected_at:
          type: string
          format: date-time
    UsageMonth:
      description: One month for one resource.
      type: object
      required: [id, resource, period, disk_bytes_last, request_count_sum, bytes_sent_sum]
      properties:
        id:
          type: string
          format: uuid
        resource:
          $ref: '#/components/schemas/UsageResource'
        period:
          type: string
          description: The month, as YYYY-MM.
        disk_bytes_last:
          type: [integer, 'null']
        request_count_sum:
          type: [integer, 'null']
        bytes_sent_sum:
          type: [integer, 'null']
    CursorLinks:
      type: object
      properties:
        first:
          type: [string, 'null']
        last:
          type: [string, 'null']
        prev:
          type: [string, 'null']
        next:
          type: [string, 'null']
    CursorMeta:
      type: object
      properties:
        path:
          type: string
        per_page:
          type: integer
        next_cursor:
          type: [string, 'null']
        prev_cursor:
          type: [string, 'null']

  /accounts/{account}/cron-jobs/{cronJob}:
    get:
      operationId: getCronJob
      summary: One cron job, with its last 20 runs
      description: Needs the cron:read ability.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/CronJobId'

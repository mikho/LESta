        '429':
          $ref: '#/components/responses/TooManyRequests'
  /accounts/{account}/backups/{backup}:
    get:
      operationId: getBackup
      summary: One backup
      description: Needs the backups:read ability.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/BackupId'
      responses:
        '200':
          description: The resource
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Backup'
        '401':

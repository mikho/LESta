name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

  agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false

      - name: Check formatting
        working-directory: agent
        run: test -z "$(gofmt -l .)"

      - name: Vet
        working-directory: agent
        run: go vet ./...

      - name: Test (nginx not installed yet; real-capability suite self-skips)
        working-directory: agent
        run: go test ./...

      - name: Install nginx
        run: sudo apt-get update && sudo apt-get install -y nginx

      - name: Test (fake and real nginx capability, nothing skips)
        working-directory: agent
        run: go test ./...

  installer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false

      - name: Report runner platform (diagnostic only)
        run: cat /etc/os-release

      - name: ShellCheck the installer
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --shell=sh --severity=style .install/lib/*.sh .install/services/nginx/install.sh

      - name: Dry-run against a real Ubuntu host (must mutate nothing)
        run: sudo sh .install/services/nginx/install.sh --dry-run --web-server nginx

      - name: Apply (real mutation on this disposable CI runner)
        run: sudo sh .install/services/nginx/install.sh --apply --web-server nginx --yes

      - name: Re-apply (idempotent rerun must still succeed)
        run: sudo sh .install/services/nginx/install.sh --apply --web-server nginx --yes

      - name: Real-capability agent tests against the installer-produced state
        working-directory: agent
        run: go test ./...

name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

  agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false

      - name: Check formatting
        working-directory: agent
        run: test -z "$(gofmt -l .)"

      - name: Vet
        working-directory: agent
        run: go vet ./...

      - name: Test (nginx not installed yet; real-capability suite self-skips)
        working-directory: agent
        run: go test ./...

      - name: Install nginx
        run: sudo apt-get update && sudo apt-get install -y nginx

      - name: Install bind9
        run: sudo apt-get update && sudo apt-get install -y bind9 bind9-utils

      - name: Test (fake, real nginx, and real bind9 capability, nothing skips)
        working-directory: agent
        run: go test ./...

  installer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false

      - name: Report runner platform (diagnostic only)
        run: cat /etc/os-release

      - name: ShellCheck the installer
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          # SC1091 excluded: it fires for the lib/*.sh files install.sh
          # sources (only resolvable with -x run from install.sh's own
          # directory, not meaningful checked from the repo root) and for
          # preflight.sh's read of /etc/os-release (a real runtime path that
          # never exists in this repository). Verified separately (locally,
          # with -x and the correct working directory) that following those
          # sources turns up nothing SC1091 was hiding.
          shellcheck --shell=sh --severity=style -e SC1091 .install/lib/*.sh .install/services/nginx/install.sh .install/services/bind9/install.sh

      - name: Prepare the runner as a bare nginx-profile node
        run: |
          # GitHub-hosted runner images are pre-provisioned, not bare: they
          # ship apache2 (which install.sh's own conflicting-package
          # preflight check correctly rejects) and no nginx.conf include
          # line at all. This step performs exactly the two things
          # nginx/README.md's "Manual prerequisite" section documents an
          # operator must do by hand before their first --apply: install
          # nginx, then add the required include line. install.sh itself
          # never touches either.
          sudo systemctl stop apache2 2>/dev/null || true
          sudo apt-get purge -y apache2 apache2-bin apache2-data apache2-utils lighttpd 2>/dev/null || true
          sudo apt-get autoremove -y
          sudo apt-get update
          sudo apt-get install -y nginx
          if ! grep -F "include" /etc/nginx/nginx.conf | grep -F "/etc/nginx/lesta.d/*.conf" >/dev/null 2>&1; then
            sudo sed -i '/^http {/a\    include /etc/nginx/lesta.d/*.conf;' /etc/nginx/nginx.conf
          fi
          cat /etc/nginx/nginx.conf

      - name: Dry-run against a real Ubuntu host (must mutate nothing)
        run: sudo sh .install/services/nginx/install.sh --dry-run --web-server nginx

      - name: Apply (real mutation on this disposable CI runner)
        run: sudo sh .install/services/nginx/install.sh --apply --web-server nginx --yes

      - name: Re-apply (idempotent rerun must still succeed)
        run: sudo sh .install/services/nginx/install.sh --apply --web-server nginx --yes

      - name: Prepare the runner for bind9
        run: |
          # Mirrors the nginx prep step above, exactly: install the
          # package, then add the required include line to
          # /etc/bind/named.conf ITSELF (not named.conf.local -- see
          # bind9/README.md's "Manual prerequisite" section for why).
          # install.sh itself never touches named.conf.
          sudo apt-get update
          sudo apt-get install -y bind9 bind9-utils
          if ! grep -F "include" /etc/bind/named.conf | grep -F "/etc/bind/lesta.d/*.conf" >/dev/null 2>&1; then
            sudo sed -i '$a\include "/etc/bind/lesta.d/*.conf";' /etc/bind/named.conf
          fi
          cat /etc/bind/named.conf

      - name: Dry-run bind9 against a real Ubuntu host (must mutate nothing)
        run: sudo sh .install/services/bind9/install.sh --dry-run

      - name: Apply bind9 (real mutation on this disposable CI runner)
        run: sudo sh .install/services/bind9/install.sh --apply --yes

      - name: Verify nginx's ports are still open after bind9's apply
        run: |
          # This is the actual regression proof for the whole phase: bind9's
          # own firewall phase must union its ports with nginx's already-
          # registered ports, never replace the shared nftables table
          # outright (see lib/firewall.sh's own top comment).
          sudo nft list table inet lesta
          curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:80/
          # nginx's default vhost may not answer a full TLS handshake
          # without a certificate, so 443 is checked as "still listening"
          # via ss rather than a full HTTPS request.
          sudo ss -H -tlnp | grep -q ':443 ' && echo "443/tcp still listening"

      - name: Re-apply bind9 (idempotent rerun must still succeed)
        run: sudo sh .install/services/bind9/install.sh --apply --yes

      - name: Re-verify nginx's ports are still open after bind9's second apply
        run: |
          sudo nft list table inet lesta
          curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:80/
          sudo ss -H -tlnp | grep -q ':443 ' && echo "443/tcp still listening"

      - name: Real-capability agent tests against the installer-produced state
        working-directory: agent
        run: go test ./...

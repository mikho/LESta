name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: lesta_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # Real process environment variables, set here rather than relying on .env.example's
      # own local-dev defaults: composer setup's own migrate --force step runs against the
      # real .env (freshly copied from .env.example on a clean CI checkout), and
      # .env.example intentionally carries different local-dev credentials (lesta/lesta) than
      # this services container (root/root, database lesta_testing). phpdotenv's safeLoad()
      # never overwrites real process env vars, so this job-level block ensures both the
      # migration step and the later test run hit the identical, correct database regardless
      # of what .env itself says.
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: lesta_testing
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: pdo_mysql
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

  agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false

      - name: Check formatting
        working-directory: agent
        run: test -z "$(gofmt -l .)"

      - name: Vet
        working-directory: agent
        run: go vet ./...

      - name: Test (nginx/pebble not installed yet; real-capability suite self-skips)
        working-directory: agent
        run: go test ./...

      - name: Install nginx
        run: sudo apt-get update && sudo apt-get install -y nginx

      - name: Install bind9
        run: sudo apt-get update && sudo apt-get install -y bind9 bind9-utils

      - name: Install apache2
        run: sudo apt-get update && sudo apt-get install -y apache2

      - name: Install Pebble
        # Let's Encrypt's own official ACME v2 test server (never a live
        # third-party service), matching this job's own real-binary
        # precedent for nginx/bind9/apache2. Unpinned: this Go-side test
        # hand-rolls its own JSON decoding into plain Go structs, which
        # tolerates newer Pebble versions' additional challenge types
        # (dns-account-01, dns-persist-01) without issue -- unlike the
        # separate PHP-side Pebble tests (acmephp/core-based, in the `ci`
        # job... not yet wired into CI -- see this phase's own final
        # report), which need a specific older Pebble version pinned due to
        # a real acmephp/core compatibility gap with those newer types.
        run: go install github.com/letsencrypt/pebble/v2/cmd/pebble@latest

      - name: Test (fake, real nginx, real bind9, real apache, and real Pebble-backed ACME capability, nothing skips)
        working-directory: agent
        run: go test ./...

  installer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false

      - name: Report runner platform (diagnostic only)
        run: cat /etc/os-release

      - name: ShellCheck the installer
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          # SC1091 excluded: it fires for the lib/*.sh files install.sh
          # sources (only resolvable with -x run from install.sh's own
          # directory, not meaningful checked from the repo root) and for
          # preflight.sh's read of /etc/os-release (a real runtime path that
          # never exists in this repository). Verified separately (locally,
          # with -x and the correct working directory) that following those
          # sources turns up nothing SC1091 was hiding.
          shellcheck --shell=sh --severity=style -e SC1091 .install/lib/*.sh .install/services/nginx/install.sh .install/services/bind9/install.sh .install/services/apache/install.sh .install/services/mariadb/install.sh .install/services/cron/install.sh .install/services/agent-daemon/install.sh

      - name: Prepare the runner as a bare nginx-profile node
        run: |
          # GitHub-hosted runner images are pre-provisioned, not bare: they
          # ship apache2 (which install.sh's own conflicting-package
          # preflight check correctly rejects) and no nginx.conf include
          # line at all. This step performs exactly the two things
          # nginx/README.md's "Manual prerequisite" section documents an
          # operator must do by hand before their first --apply: install
          # nginx, then add the required include line. install.sh itself
          # never touches either.
          sudo systemctl stop apache2 2>/dev/null || true
          sudo apt-get purge -y apache2 apache2-bin apache2-data apache2-utils lighttpd 2>/dev/null || true
          sudo apt-get autoremove -y
          sudo apt-get update
          sudo apt-get install -y nginx
          if ! grep -F "include" /etc/nginx/nginx.conf | grep -F "/etc/nginx/lesta.d/*.conf" >/dev/null 2>&1; then
            sudo sed -i '/^http {/a\    include /etc/nginx/lesta.d/*.conf;' /etc/nginx/nginx.conf
          fi
          cat /etc/nginx/nginx.conf

      - name: Dry-run against a real Ubuntu host (must mutate nothing)
        run: sudo sh .install/services/nginx/install.sh --dry-run --web-server nginx

      - name: Apply (real mutation on this disposable CI runner)
        run: sudo sh .install/services/nginx/install.sh --apply --web-server nginx --yes

      - name: Re-apply (idempotent rerun must still succeed)
        run: sudo sh .install/services/nginx/install.sh --apply --web-server nginx --yes

      - name: Standalone Apache installer coverage (help/version/dry-run/argument validation only; a real --apply here would conflict with nginx already owning 80/443 in this same job)
        run: |
          sh .install/services/apache/install.sh --help
          sh .install/services/apache/install.sh --version

          # --dry-run (default --web-profile apache): nginx already owns
          # 80/443 and is already installed on this runner, so apache's own
          # preflight (port-free + conflicting-package checks) must
          # correctly detect the real conflict and fail closed, never
          # proceed to would_change.
          set +e
          sudo sh .install/services/apache/install.sh --dry-run
          status=$?
          set -e
          if [ "${status}" -ne 12 ]; then
            echo "expected --dry-run (default apache profile) to fail preflight with exit 12 (EXIT_PREFLIGHT_CONFLICT) against a node where nginx already owns 80/443, got exit ${status}" >&2
            exit 1
          fi

          # --dry-run --web-profile both: skips the port/package preflight
          # entirely (nginx legitimately owns 80/443 in this profile), but
          # apache2 itself is never installed in this job, so the
          # apache2.conf include-line precondition correctly fails instead.
          set +e
          sudo sh .install/services/apache/install.sh --dry-run --web-profile both
          status=$?
          set -e
          if [ "${status}" -ne 12 ]; then
            echo "expected --dry-run --web-profile both to fail preflight with exit 12 (EXIT_PREFLIGHT_CONFLICT, missing apache2.conf) since apache2 is never installed in this job, got exit ${status}" >&2
            exit 1
          fi

          # Invalid invocations: pure argument validation, no infra needed.
          set +e
          sh .install/services/apache/install.sh
          status=$?
          set -e
          if [ "${status}" -ne 10 ]; then
            echo "expected a no-arguments invocation to fail with exit 10 (EXIT_INVALID_INVOCATION), got exit ${status}" >&2
            exit 1
          fi

          set +e
          sh .install/services/apache/install.sh --dry-run --web-profile bogus
          status=$?
          set -e
          if [ "${status}" -ne 10 ]; then
            echo "expected an invalid --web-profile value to fail with exit 10 (EXIT_INVALID_INVOCATION), got exit ${status}" >&2
            exit 1
          fi

      - name: Prepare the runner for bind9
        run: |
          # Mirrors the nginx prep step above, exactly: install the
          # package, then add the required include line to
          # /etc/bind/named.conf ITSELF (not named.conf.local -- see
          # bind9/README.md's "Manual prerequisite" section for why).
          # install.sh itself never touches named.conf.
          sudo apt-get update
          sudo apt-get install -y bind9 bind9-utils
          if ! grep -F "include" /etc/bind/named.conf | grep -F "/etc/bind/lesta.d/*.conf" >/dev/null 2>&1; then
            sudo sed -i '$a\include "/etc/bind/lesta.d/*.conf";' /etc/bind/named.conf
          fi
          cat /etc/bind/named.conf

      - name: Dry-run bind9 against a real Ubuntu host (must mutate nothing)
        run: sudo sh .install/services/bind9/install.sh --dry-run

      - name: Apply bind9 (real mutation on this disposable CI runner)
        run: sudo sh .install/services/bind9/install.sh --apply --yes

      - name: Diagnose bind9 apply failure (only runs if the step above failed)
        if: failure()
        run: |
          sudo systemctl status named --no-pager || true
          echo "--- full named journal, grepped for the self-test zone ---"
          sudo journalctl -u named --no-pager | grep -i selftest || true
          echo "--- last 40 lines of the named journal, unfiltered ---"
          sudo journalctl -u named --no-pager -n 40 || true
          echo "--- AppArmor status ---"
          sudo aa-status || true
          echo "--- kernel log, grepped for apparmor denials against named ---"
          sudo dmesg 2>/dev/null | grep -i apparmor | grep -i named || true
          sudo journalctl -k --no-pager | grep -iE 'apparmor.*(denied|named)' || true
          echo "--- zone data directory ownership/permissions ---"
          sudo ls -laR /var/lib/lesta/bind/zones 2>&1 || true
          echo "--- full path walk (namei), the definitive tool for this bug class ---"
          sudo namei -l /var/lib/lesta/bind/zones/*/generations/1/zone.db 2>&1 || true
          echo "--- bind user's actual group memberships ---"
          id bind || true
          echo "--- named.service unit, checking for sandboxing directives ---"
          systemctl cat named 2>&1 || true
          echo "--- /etc/default/named (checking for a chroot -t flag) ---"
          sudo cat /etc/default/named 2>&1 || true
          echo "--- direct traversal test AS the bind user, bypassing all speculation ---"
          sudo -u bind test -x /var/lib/lesta/bind && echo "bind CAN exec/traverse /var/lib/lesta/bind" || echo "bind CANNOT exec/traverse /var/lib/lesta/bind"
          sudo -u bind ls -la /var/lib/lesta/bind/zones 2>&1 || true
          echo "--- full AppArmor profile for named (checking for a silent/unlogged deny rule) ---"
          sudo cat /etc/apparmor.d/usr.sbin.named 2>&1 || true
          sudo cat /etc/apparmor.d/local/usr.sbin.named 2>&1 || true
          echo "--- ss :53 ---"
          sudo ss -H -tlnp | grep ':53 ' || true
          sudo ss -H -ulnp | grep ':53 ' || true

      - name: Verify nginx's ports are still open after bind9's apply
        run: |
          # This is the actual regression proof for the whole phase: bind9's
          # own firewall phase must union its ports with nginx's already-
          # registered ports, never replace the shared nftables table
          # outright (see lib/firewall.sh's own top comment).
          sudo nft list table inet lesta | tee /tmp/lesta-nft.txt
          curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:80/
          # A bare `apt-get install nginx` never configures an SSL vhost, so
          # nginx genuinely never binds 443 in this job regardless of
          # bind9's own changes -- there was never a live listener to
          # regression-check here. The real, always-true guarantee this
          # step exists to prove is that bind9's firewall phase didn't
          # drop nginx's port from the shared nftables table, checked
          # directly against the listing above instead.
          grep -q '443' /tmp/lesta-nft.txt && echo "443/tcp still allowed in the firewall table"

      - name: Re-apply bind9 (idempotent rerun must still succeed)
        run: sudo sh .install/services/bind9/install.sh --apply --yes

      - name: Re-verify nginx's ports are still open after bind9's second apply
        run: |
          sudo nft list table inet lesta | tee /tmp/lesta-nft-2.txt
          curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:80/
          grep -q '443' /tmp/lesta-nft-2.txt && echo "443/tcp still allowed in the firewall table"

      - name: Prepare the runner for mariadb (purge any pre-installed default MySQL/MariaDB so the pinned MariaDB Foundation package installs cleanly)
        run: |
          sudo systemctl stop mysql mariadb 2>/dev/null || true
          sudo apt-get purge -y mysql-server mysql-server-core-* mysql-client-core-* mariadb-server mariadb-server-core-* 2>/dev/null || true
          sudo apt-get autoremove -y
          sudo rm -rf /var/lib/mysql /etc/mysql

      - name: Dry-run mariadb against a real Ubuntu host (must mutate nothing)
        run: sudo sh .install/services/mariadb/install.sh --dry-run

      - name: Apply mariadb (real mutation on this disposable CI runner)
        run: sudo sh .install/services/mariadb/install.sh --apply --yes

      - name: Diagnose mariadb apply failure (only runs if the step above failed)
        if: failure()
        run: |
          echo "--- systemctl status mariadb.service (control-plane, default instance) ---"
          sudo systemctl status mariadb.service --no-pager || true
          echo "--- journalctl for mariadb.service ---"
          sudo journalctl -u mariadb.service --no-pager | tail -150 || true
          echo "--- /var/log/mysql/error.log (control-plane's own stock error log path) ---"
          sudo cat /var/log/mysql/error.log 2>&1 || true
          echo "--- ss -tlnp (3306) ---"
          sudo ss -H -tlnp | grep ':3306 ' || true
          echo "--- /etc/mysql/mariadb.conf.d/99-lesta-control-plane.cnf ---"
          sudo cat /etc/mysql/mariadb.conf.d/99-lesta-control-plane.cnf 2>&1 || true
          echo "--- /var/lib/lesta/mariadb/control-plane listing ---"
          sudo ls -la /var/lib/lesta/mariadb/control-plane 2>&1 || true
          echo "--- /run/mysqld listing ---"
          sudo ls -la /run/mysqld 2>&1 || true
          echo "--- systemctl status mariadb@tenant.service ---"
          sudo systemctl status mariadb@tenant.service --no-pager || true
          echo "--- journalctl for mariadb@tenant.service ---"
          sudo journalctl -u mariadb@tenant.service --no-pager | tail -100 || true
          echo "--- ss -tlnp (3307) ---"
          sudo ss -H -tlnp | grep ':3307 ' || true
          echo "--- /etc/mysql/mariadb.conf.d/99-lesta-tenant.cnf ---"
          sudo cat /etc/mysql/mariadb.conf.d/99-lesta-tenant.cnf 2>&1 || true
          echo "--- kernel log, grepped for any apparmor denial against mariadbd ---"
          sudo journalctl -k --no-pager | grep -i 'apparmor.*mariadbd' | tail -40 || true

      - name: Verify nginx's and bind9's ports are still open after mariadb's apply
        run: |
          sudo nft list table inet lesta | tee /tmp/lesta-nft-3.txt
          curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:80/
          grep -q '443' /tmp/lesta-nft-3.txt && echo "443/tcp still allowed in the firewall table"
          grep -q '53' /tmp/lesta-nft-3.txt && echo "53 still allowed in the firewall table"

      - name: Re-apply mariadb (idempotent rerun must still succeed)
        run: sudo sh .install/services/mariadb/install.sh --apply --yes

      - name: Dry-run cron against a real Ubuntu host (must mutate nothing)
        run: sudo sh .install/services/cron/install.sh --dry-run

      - name: Apply cron (real mutation on this disposable CI runner)
        run: sudo sh .install/services/cron/install.sh --apply --yes

      - name: Diagnose cron apply failure (only runs if the step above failed)
        if: failure()
        run: |
          echo "--- systemctl status cron ---"
          sudo systemctl status cron --no-pager || true
          echo "--- journalctl for cron ---"
          sudo journalctl -u cron --no-pager | tail -100 || true
          echo "--- id lesta-cron ---"
          id lesta-cron || true
          echo "--- /etc/cron.d ---"
          sudo ls -la /etc/cron.d || true
          echo "--- /var/lib/lesta/cron ---"
          sudo ls -laR /var/lib/lesta/cron 2>&1 || true

      - name: Verify nginx, bind9, and mariadb are all still up after cron's apply
        run: |
          sudo nft list table inet lesta | tee /tmp/lesta-nft-4.txt
          curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:80/
          grep -q '443' /tmp/lesta-nft-4.txt && echo "443/tcp still allowed in the firewall table"
          grep -q '53' /tmp/lesta-nft-4.txt && echo "53 still allowed in the firewall table"
          sudo systemctl is-active named
          sudo systemctl is-active mariadb@tenant.service
          sudo mariadb --socket=/run/mysqld/mysqld.tenant.sock -u root -e "SELECT 1;"

      - name: Re-apply cron (idempotent rerun must still succeed)
        run: sudo sh .install/services/cron/install.sh --apply --yes

      - name: Relax AppArmor for named before running the disposable-harness tests
        run: |
          # The Go test suite's own disposable bind9 harness
          # (agent/internal/capability/bind9/harness_test.go) points a real
          # named at a config under t.TempDir() (/tmp/...), a path outside
          # the production AppArmor profile's allow-list -- confirmed
          # directly via a kernel audit denial naming that exact test's own
          # tmp path. Production named (confined to /etc/bind, /var/lib/
          # bind, /var/cache/bind, and now /var/lib/lesta/bind) should stay
          # fully enforced; only this disposable, thrown-away CI runner's
          # test run needs the relaxation, so this never weakens what a
          # real node actually enforces.
          # apparmor_parser directly, not aa-complain: aa-complain's Python
          # tooling scans the entire /etc/apparmor.d/ directory and this
          # runner image ships two overlapping, pre-existing, unrelated
          # profiles for Microsoft Edge that make that whole-directory scan
          # error out before it ever reaches named. apparmor_parser -C
          # operates only on the one file given to it.
          sudo apparmor_parser -r -C /etc/apparmor.d/usr.sbin.named

      - name: Real-capability agent tests against the installer-produced state
        working-directory: agent
        run: go test ./...

      - name: Diagnose agent test failure (only runs if the step above failed)
        if: failure()
        run: |
          echo "--- kernel log, grepped for any apparmor denial against named ---"
          sudo journalctl -k --no-pager | grep -i 'apparmor.*named' | tail -40 || true
          echo "--- is a real system named currently active? ---"
          sudo systemctl status named --no-pager || true
          echo "--- what's listening on 53 right now ---"
          sudo ss -H -tlnp | grep ':53 ' || true
          sudo ss -H -ulnp | grep ':53 ' || true

  installer-both-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false

      - name: Prepare the runner as a bare node (nginx + apache2 installed and configured, apache2 stopped so nginx can claim port 80 first)
        run: |
          # Mirrors the "installer" job's own "prepare as a bare node"
          # pattern, extended to both web server packages: this profile
          # needs BOTH nginx.conf's and apache2.conf's own include lines
          # satisfied as manual operator prerequisites before either
          # install.sh invocation below, exactly like the "installer" job's
          # own nginx/bind9 prep steps already do one at a time.
          #
          # apache2 is stopped (not purged) right after its own prereqs are
          # satisfied: its package postinst auto-starts it bound to the
          # stock port 80, which would otherwise collide with nginx's own
          # preflight/bind moments later in this same job. apache/install.sh
          # itself (invoked via nginx/install.sh's own --web-server both
          # delegation) reconfigures and restarts apache2 on its real
          # loopback port (8080) once nginx already owns 80.
          sudo systemctl stop nginx apache2 2>/dev/null || true
          sudo apt-get purge -y nginx nginx-common nginx-core apache2 apache2-bin apache2-data apache2-utils lighttpd bind9 bind9-utils 2>/dev/null || true
          sudo apt-get autoremove -y
          sudo apt-get update

          sudo apt-get install -y nginx
          if ! grep -F "include" /etc/nginx/nginx.conf | grep -F "/etc/nginx/lesta.d/*.conf" >/dev/null 2>&1; then
            sudo sed -i '/^http {/a\    include /etc/nginx/lesta.d/*.conf;' /etc/nginx/nginx.conf
          fi
          cat /etc/nginx/nginx.conf

          sudo apt-get install -y apache2
          if ! grep -F "Include" /etc/apache2/apache2.conf | grep -F "/etc/apache2/lesta.d/*.conf" >/dev/null 2>&1; then
            printf '\nIncludeOptional /etc/apache2/lesta.d/*.conf\n' | sudo tee -a /etc/apache2/apache2.conf >/dev/null
          fi
          cat /etc/apache2/apache2.conf
          sudo systemctl stop apache2

      - name: Dry-run nginx --web-server both (must mutate nothing)
        run: sudo sh .install/services/nginx/install.sh --dry-run --web-server both

      - name: Apply nginx --web-server both (real mutation on this disposable CI runner; installs and health-checks nginx, then delegates to apache/install.sh --web-profile both)
        run: sudo sh .install/services/nginx/install.sh --apply --yes --web-server both

      - name: Re-apply nginx --web-server both (idempotent rerun must still succeed, covering the orchestration path itself, not just each leaf script alone)
        run: sudo sh .install/services/nginx/install.sh --apply --yes --web-server both

      - name: Verify both nginx and apache2 are active
        run: |
          sudo systemctl is-active nginx
          sudo systemctl is-active apache2

      - name: Verify /etc/lesta/web-profile contains 'both'
        run: |
          sudo cat /etc/lesta/web-profile
          [ "$(sudo cat /etc/lesta/web-profile)" = "both" ]

      - name: Verify apache2 is listening on its loopback backend port, never on public 80
        run: |
          sudo ss -H -tlnp | grep ':8080 ' | grep -q apache2
          ! sudo ss -H -tlnp | grep ':80 ' | grep -q apache2
          curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:80/

      - name: Real-capability agent tests against the installer-produced both-profile system (exercises apacheProductionConfig()'s port-8080 branch against a genuinely both-profiled node)
        working-directory: agent
        run: go test ./...

      - name: Diagnose a failure in this job (only runs if a step above failed)
        if: failure()
        run: |
          echo "--- systemctl status nginx ---"
          sudo systemctl status nginx --no-pager || true
          echo "--- systemctl status apache2 ---"
          sudo systemctl status apache2 --no-pager || true
          echo "--- ss -tlnp (80 and 8080) ---"
          sudo ss -H -tlnp | grep -E ':(80|8080) ' || true
          echo "--- /etc/lesta/web-profile ---"
          sudo cat /etc/lesta/web-profile 2>&1 || true
          echo "--- apache2 error log ---"
          sudo tail -n 60 /var/log/apache2/error.log 2>&1 || true

  installer-scenarios:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        # Needed by Scenarios 7 and 8 below, which each build a second real
        # agent-shaped Go binary (a trivially modified real build for the
        # generation-swap scenario, a deliberately broken but genuinely
        # compiled stand-in for the rollback scenario), never a fabricated
        # non-executable file.
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false

      - name: Prepare the runner as a bare nginx-profile node
        run: |
          sudo systemctl stop apache2 2>/dev/null || true
          sudo apt-get purge -y apache2 apache2-bin apache2-data apache2-utils lighttpd 2>/dev/null || true
          sudo apt-get autoremove -y
          sudo apt-get update
          sudo apt-get install -y nginx
          if ! grep -F "include" /etc/nginx/nginx.conf | grep -F "/etc/nginx/lesta.d/*.conf" >/dev/null 2>&1; then
            sudo sed -i '/^http {/a\    include /etc/nginx/lesta.d/*.conf;' /etc/nginx/nginx.conf
          fi

      # --- Scenario 1: failed-validation (nginx, dry-run) ---------------
      #
      # preflight_check_lesta_identity (.install/lib/preflight.sh) rejects a
      # pre-existing lesta-agent user whose home/shell do not match what it
      # would create (home=/var/lib/lesta, shell=/usr/sbin/nologin).

      - name: "Scenario 1 setup: create a conflicting lesta-agent system user"
        run: sudo useradd --system --home-dir /nonexistent --shell /bin/false lesta-agent

      - name: "Scenario 1: failed-validation (nginx dry-run) must reject the conflicting lesta-agent identity"
        run: |
          set +e
          result=$(sudo sh .install/services/nginx/install.sh --dry-run --web-server nginx 2>/tmp/scenario1-stderr.log)
          status=$?
          set -e
          echo "${result}"
          echo "--- stderr log ---"
          cat /tmp/scenario1-stderr.log || true
          if [ "${status}" -ne 12 ]; then
            echo "expected exit 12 (EXIT_PREFLIGHT_CONFLICT), got ${status}" >&2
            exit 1
          fi
          printf '%s' "${result}" | grep -oE '"exit_code":[0-9]+'
          printf '%s' "${result}" | grep -q '"code":"conflicting_identity"' \
            || { echo "expected the result body to contain \"code\":\"conflicting_identity\"" >&2; exit 1; }

      - name: "Scenario 1 cleanup: remove the conflicting lesta-agent user before any later scenario needs the real one absent"
        run: sudo userdel lesta-agent

      # --- Scenario 2: failed-health (nginx) ----------------------------
      #
      # A syntactically invalid fragment pre-seeded in /etc/nginx/lesta.d
      # makes `nginx -t` fail deterministically during install_nginx.

      - name: "Scenario 2 setup: poison /etc/nginx/lesta.d with an invalid fragment"
        run: |
          sudo install -d -m 0755 /etc/nginx/lesta.d
          printf 'this is not valid nginx config {{{\n' | sudo tee /etc/nginx/lesta.d/zzz-poison.conf

      - name: "Scenario 2: failed-health (nginx apply) must fail nginx -t on the poisoned fragment"
        run: |
          set +e
          result=$(sudo sh .install/services/nginx/install.sh --apply --yes --web-server nginx 2>/tmp/scenario2-stderr.log)
          status=$?
          set -e
          echo "${result}"
          echo "--- stderr log ---"
          cat /tmp/scenario2-stderr.log || true
          if [ "${status}" -ne 21 ]; then
            echo "expected exit 21 (EXIT_HEALTH_FAILURE), got ${status}" >&2
            exit 1
          fi
          printf '%s' "${result}" | grep -oE '"exit_code":[0-9]+'
          printf '%s' "${result}" | grep -q '"code":"nginx_test_failed"' \
            || { echo "expected the result body to contain \"code\":\"nginx_test_failed\"" >&2; exit 1; }

      - name: "Scenario 2 cleanup: remove the poisoned fragment so the next real apply isn't blocked by it"
        run: sudo rm -f /etc/nginx/lesta.d/zzz-poison.conf

      # --- Scenario 3: interrupted (nginx) -------------------------------
      #
      # checkpoint.sh's own top comment states plainly that nothing in it
      # ever causes a phase to be skipped outright, the checkpoint is a
      # diagnostic and recovery record, not a short-circuit. This scenario
      # proves idempotent reconvergence after a hard kill, never "resume
      # from checkpoint" (no such mechanism exists to resume from).

      - name: "Scenario 3: kill a real --apply mid-flight with SIGKILL"
        run: |
          sudo sh .install/services/nginx/install.sh --apply --yes --web-server nginx &
          pid=$!
          sleep 2
          sudo kill -KILL "${pid}" 2>/dev/null || true
          wait "${pid}" 2>/dev/null || true

      - name: "Scenario 3: a second --apply must converge to success (idempotent reconvergence, not checkpoint resume)"
        run: |
          set +e
          result=$(sudo sh .install/services/nginx/install.sh --apply --yes --web-server nginx 2>/tmp/scenario3-stderr.log)
          status=$?
          set -e
          echo "${result}"
          echo "--- stderr log ---"
          cat /tmp/scenario3-stderr.log || true
          if [ "${status}" -ne 0 ]; then
            echo "expected exit 0 (EXIT_OK) on the post-kill re-apply, got ${status}" >&2
            exit 1
          fi
          printf '%s' "${result}" | grep -oE '"exit_code":[0-9]+'
          printf '%s' "${result}" | grep -q '"status":"applied"' \
            || { echo "expected the result body to contain \"status\":\"applied\"" >&2; exit 1; }
          sudo systemctl is-active nginx
          curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:80/

      # --- Scenario 4: tampered (nginx via node-health) ------------------
      #
      # Corrupts THIS RUNNER's own checked-out node-health/manifest.json
      # sha256 (never the committed repo), so agent_install_binary's
      # verify_sha256 call rejects the real, correctly-built vendored agent
      # binary. Restored via `git checkout --` immediately afterward.

      - name: "Scenario 4 setup: corrupt this runner's own checked-out node-health manifest sha256"
        run: |
          manifest=.install/services/node-health/manifest.json
          real_sha256=$(grep -oE '"sha256": ?"[a-f0-9]{64}"' "${manifest}" | grep -oE '[a-f0-9]{64}')
          if [ -z "${real_sha256}" ]; then
            echo "could not read the real sha256 out of ${manifest}; the manifest's own artifacts[] shape may have changed" >&2
            exit 1
          fi
          echo "real sha256: ${real_sha256}"
          tampered_sha256="ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff"
          sudo sed -i "s/${real_sha256}/${tampered_sha256}/" "${manifest}"
          if ! grep -q "${tampered_sha256}" "${manifest}"; then
            echo "the sed replacement did not change ${manifest}; refusing to silently no-op the tamper" >&2
            exit 1
          fi

      - name: "Scenario 4: tampered node-health manifest sha256 must be rejected as a checksum mismatch"
        run: |
          set +e
          result=$(sudo sh .install/services/nginx/install.sh --apply --yes --web-server nginx 2>/tmp/scenario4-stderr.log)
          status=$?
          set -e
          echo "${result}"
          echo "--- stderr log ---"
          cat /tmp/scenario4-stderr.log || true
          if [ "${status}" -ne 13 ]; then
            echo "expected exit 13 (EXIT_VERIFICATION_FAILURE), got ${status}" >&2
            exit 1
          fi
          printf '%s' "${result}" | grep -oE '"exit_code":[0-9]+'
          printf '%s' "${result}" | grep -q '"code":"checksum_mismatch"' \
            || { echo "expected the result body to contain \"code\":\"checksum_mismatch\"" >&2; exit 1; }

      - name: "Scenario 4 cleanup: restore the committed node-health manifest"
        run: git checkout -- .install/services/node-health/manifest.json

      # --- Scenario 5: conflicting, bind9 (dry-run) ----------------------
      #
      # preflight_check_conflicting_dns_packages (bind9/install.sh) rejects
      # dnsmasq/unbound/powerdns via dpkg -l.

      - name: "Scenario 5 setup: install a real, genuinely conflicting unbound package"
        run: |
          sudo apt-get update
          sudo apt-get install -y unbound

      - name: "Scenario 5: conflicting (bind9 dry-run) must reject the pre-installed unbound package"
        run: |
          set +e
          result=$(sudo sh .install/services/bind9/install.sh --dry-run 2>/tmp/scenario5-stderr.log)
          status=$?
          set -e
          echo "${result}"
          echo "--- stderr log ---"
          cat /tmp/scenario5-stderr.log || true
          if [ "${status}" -ne 12 ]; then
            echo "expected exit 12 (EXIT_PREFLIGHT_CONFLICT), got ${status}" >&2
            exit 1
          fi
          printf '%s' "${result}" | grep -oE '"exit_code":[0-9]+'
          printf '%s' "${result}" | grep -q '"code":"conflicting_package"' \
            || { echo "expected the result body to contain \"code\":\"conflicting_package\"" >&2; exit 1; }

      - name: "Scenario 5 cleanup: purge unbound (this job doesn't otherwise need bind9 installed for real)"
        run: |
          sudo apt-get purge -y unbound
          sudo apt-get autoremove -y

      # --- Scenario 6: conflicting, mariadb -------------------------------
      #
      # Unlike the "installer" job, this scenario deliberately skips the
      # defensive MySQL purge and instead holds the runner's pre-installed
      # MySQL packages, so `apt-get install -y mariadb-server` cannot
      # resolve. Confirmed on a real CI run: MariaDB Foundation's
      # mariadb-server package does declare real dpkg-level Conflicts:
      # against mysql-server/mysql-server-8.0 (and mariadb-client Breaks:
      # against it too), so apt-get itself refuses to resolve the held
      # conflict and install.sh's own existing apt_install_failed path
      # (EXIT_MUTATION_FAILURE) fires, exactly as for any other apt-get
      # install failure.

      - name: "Scenario 6 setup: hold the runner's pre-installed MySQL packages"
        run: sudo apt-mark hold mysql-server mysql-server-8.0 mysql-community-server 2>/dev/null || true

      - name: "Scenario 6: conflicting (mariadb apply) must reject the held, conflicting MySQL packages"
        run: |
          set +e
          result=$(sudo sh .install/services/mariadb/install.sh --apply --yes 2>/tmp/scenario6-stderr.log)
          status=$?
          set -e
          echo "${result}"
          echo "--- stderr log ---"
          cat /tmp/scenario6-stderr.log || true
          if [ "${status}" -ne 20 ]; then
            echo "expected exit 20 (EXIT_MUTATION_FAILURE), got ${status}" >&2
            exit 1
          fi
          printf '%s' "${result}" | grep -oE '"exit_code":[0-9]+'
          printf '%s' "${result}" | grep -q '"code":"apt_install_failed"' \
            || { echo "expected the result body to contain \"code\":\"apt_install_failed\"" >&2; exit 1; }

      - name: "Scenario 6 cleanup: unhold the runner's MySQL packages"
        run: sudo apt-mark unhold mysql-server mysql-server-8.0 mysql-community-server 2>/dev/null || true

      # cron gets no conflicting-package scenario, no competing package exists in this project's manifest set for it to reject.

      # --- Scenario 7: generation swap (nginx, real second binary) -------
      #
      # Proves the generation-aware half of agent_install_binary
      # (.install/lib/agent.sh): when the destination binary already exists
      # and the manifest's own expected sha256 changes to a genuinely
      # different, still-valid build, the previous generation is backed up
      # to AGENT_BINARY_DEST.previous before the new one is copied in, and
      # the new generation's own self-test still passes cleanly.
      #
      # The "second, different, still-validly-checksummed agent binary" is a
      # real compiled build of the actual agent source with one trivial,
      # behavior-neutral edit (a different agentVersion string constant),
      # never a fabricated file: `go build` runs against a real copy of the
      # module, exactly like `composer agent:build` does for the vendored
      # one, so the resulting binary is byte-different (a real new sha256)
      # but functionally identical for this self-test's own OperationEnvelope
      # round trip.
      #
      # By this point in the job, Scenario 3 has already driven nginx through
      # one full successful --apply, so AGENT_BINARY_DEST already holds the
      # original, committed agent binary. Scenario 4 (tampered) may also have
      # left a spurious AGENT_BINARY_DEST.previous behind (agent_install_binary
      # backs up the current destination as soon as its sha256 disagrees with
      # the manifest's expected value, before the source itself is ever
      # checksum-verified, so Scenario 4's deliberately-wrong expected value
      # triggers a backup even though the wrong-source-checksum failure that
      # follows means no real generation-swap ever intended it) -- removed
      # explicitly below so this scenario's own before/after assertions are
      # meaningful.

      - name: "Scenario 7 setup: build a second, real, differently-checksummed agent binary"
        run: |
          sudo rm -f /var/lib/lesta/agent/bin/lesta-agent.previous
          rm -rf /tmp/agent-gen2
          cp -r agent /tmp/agent-gen2
          sed -i 's/agentVersion = "1.0.0"/agentVersion = "1.0.0-scenario7-gen2"/' /tmp/agent-gen2/cmd/lesta-agent/main.go
          grep -q 'agentVersion = "1.0.0-scenario7-gen2"' /tmp/agent-gen2/cmd/lesta-agent/main.go
          (cd /tmp/agent-gen2 && GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o /tmp/lesta-agent-gen2 ./cmd/lesta-agent)
          test -x /tmp/lesta-agent-gen2

      - name: "Scenario 7: confirm the pre-swap baseline (original binary in place, no .previous yet)"
        # /var/lib/lesta/agent/bin is 0750 lesta-agent:lesta; the runner user
        # can't traverse it at all without sudo, so every read against a
        # path under it here uses sudo, not just the mutating install.sh
        # invocations elsewhere in these scenarios.
        run: |
          sudo test ! -f /var/lib/lesta/agent/bin/lesta-agent.previous \
            || { echo "expected no .previous before this scenario's own swap" >&2; exit 1; }
          orig_sha256=$(sudo sha256sum /var/lib/lesta/agent/bin/lesta-agent | awk '{print $1}')
          echo "orig_sha256=${orig_sha256}" >> "${GITHUB_ENV}"

      - name: "Scenario 7: point the manifest at the second binary and re-apply -- must swap generations and stay healthy"
        run: |
          new_sha256=$(sha256sum /tmp/lesta-agent-gen2 | awk '{print $1}')
          echo "new_sha256=${new_sha256}" >> "${GITHUB_ENV}"
          sudo cp /tmp/lesta-agent-gen2 agent/dist/lesta-agent-linux-amd64

          manifest=.install/services/node-health/manifest.json
          current_sha256=$(grep -oE '"sha256": ?"[a-f0-9]{64}"' "${manifest}" | grep -oE '[a-f0-9]{64}')
          sudo sed -i "s/${current_sha256}/${new_sha256}/" "${manifest}"
          grep -q "${new_sha256}" "${manifest}"

          result=$(sudo sh .install/services/nginx/install.sh --apply --yes --web-server nginx 2>/tmp/scenario7-stderr.log)
          status=$?
          echo "${result}"
          echo "--- stderr log ---"
          cat /tmp/scenario7-stderr.log || true
          if [ "${status}" -ne 0 ]; then
            echo "expected exit 0 (EXIT_OK): the second binary is real and healthy, only its checksum differs, got exit ${status}" >&2
            exit 1
          fi
          printf '%s' "${result}" | grep -q '"status":"applied"' \
            || { echo "expected the result body to contain \"status\":\"applied\"" >&2; exit 1; }

      - name: "Scenario 7: assert the previous generation was backed up and the live binary is now the new generation"
        run: |
          sudo test -f /var/lib/lesta/agent/bin/lesta-agent.previous \
            || { echo "expected /var/lib/lesta/agent/bin/lesta-agent.previous to exist after a real generation swap" >&2; exit 1; }
          previous_sha256=$(sudo sha256sum /var/lib/lesta/agent/bin/lesta-agent.previous | awk '{print $1}')
          live_sha256=$(sudo sha256sum /var/lib/lesta/agent/bin/lesta-agent | awk '{print $1}')
          if [ "${previous_sha256}" != "${orig_sha256}" ]; then
            echo "expected .previous sha256 (${previous_sha256}) to equal the original binary's sha256 (${orig_sha256})" >&2
            exit 1
          fi
          if [ "${live_sha256}" != "${new_sha256}" ]; then
            echo "expected the live binary's sha256 (${live_sha256}) to equal the new generation's sha256 (${new_sha256})" >&2
            exit 1
          fi
          echo "generation swap confirmed: .previous=${previous_sha256} (original), live=${live_sha256} (new)"

      - name: "Scenario 7 cleanup: restore the committed manifest/binary, then reconverge the live binary back to the original generation"
        run: |
          git checkout -- .install/services/node-health/manifest.json agent/dist/lesta-agent-linux-amd64
          sudo sh .install/services/nginx/install.sh --apply --yes --web-server nginx
          sudo rm -f /var/lib/lesta/agent/bin/lesta-agent.previous

      # --- Scenario 8: automatic rollback (nginx, real broken binary) ----
      #
      # Proves agent_rollback_binary and the bootstrap_node_health wiring in
      # nginx/install.sh: a new generation that is checksum-correct against
      # the manifest (so agent_install_binary's own copy step succeeds, and
      # AGENT_BINARY_DEST.previous is created) but is not actually a working
      # lesta-agent (so the self-test that follows fails) must be
      # automatically rolled back to the previous, still-good generation,
      # and the overall run must fail (a rejected upgrade), but NOT with
      # EXIT_ROLLBACK_FAILURE, since the rollback itself succeeds.
      #
      # This is a different, more reliable failure-injection technique than
      # a checksum mismatch (Scenario 4 above): a checksum mismatch is
      # caught by verify_sha256 BEFORE any copy happens, which would never
      # exercise agent_rollback_binary's real restore path at all. Instead,
      # the stand-in binary here is deliberately made checksum-CORRECT
      # against the manifest (a real `go build` of a trivial always-exits-1
      # program, not a mock and not a fabricated non-executable file), so
      # the copy genuinely succeeds and only the self-test that runs
      # afterward, against the real just-installed binary, fails.

      - name: "Scenario 8 setup: build a real, checksum-valid, but non-functional agent binary"
        run: |
          rm -rf /tmp/agent-broken
          mkdir -p /tmp/agent-broken
          cat > /tmp/agent-broken/main.go <<'BROKENGO'
          package main

          import "os"

          // A deliberately broken stand-in for lesta-agent: a real compiled
          // Go binary (not a mock or a fabricated non-executable file) that
          // always exits non-zero, simulating a shipped build that is
          // checksum-correct but non-functional against any real
          // OperationEnvelope. Used only to force bootstrap_node_health's
          // own self-test to fail AFTER agent_install_binary has already
          // copied it into place, so this scenario genuinely exercises
          // agent_rollback_binary's real restore path end to end.
          func main() {
          	os.Exit(1)
          }
          BROKENGO
          (cd /tmp/agent-broken && go mod init lesta-agent-broken && GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/lesta-agent-broken .)
          test -x /tmp/lesta-agent-broken

      - name: "Scenario 8: confirm the pre-rollback baseline (original binary in place, no .previous yet)"
        run: |
          sudo test ! -f /var/lib/lesta/agent/bin/lesta-agent.previous \
            || { echo "expected no .previous before this scenario's own swap" >&2; exit 1; }
          orig_sha256=$(sudo sha256sum /var/lib/lesta/agent/bin/lesta-agent | awk '{print $1}')
          echo "s8_orig_sha256=${orig_sha256}" >> "${GITHUB_ENV}"

      - name: "Scenario 8: swap in the broken binary -- --apply must roll back to the original generation and fail (not with EXIT_ROLLBACK_FAILURE)"
        run: |
          broken_sha256=$(sha256sum /tmp/lesta-agent-broken | awk '{print $1}')
          sudo cp /tmp/lesta-agent-broken agent/dist/lesta-agent-linux-amd64

          manifest=.install/services/node-health/manifest.json
          current_sha256=$(grep -oE '"sha256": ?"[a-f0-9]{64}"' "${manifest}" | grep -oE '[a-f0-9]{64}')
          sudo sed -i "s/${current_sha256}/${broken_sha256}/" "${manifest}"
          grep -q "${broken_sha256}" "${manifest}"

          set +e
          result=$(sudo sh .install/services/nginx/install.sh --apply --yes --web-server nginx 2>/tmp/scenario8-stderr.log)
          status=$?
          set -e
          echo "${result}"
          echo "--- stderr log ---"
          cat /tmp/scenario8-stderr.log || true

          if [ "${status}" -eq 0 ]; then
            echo "expected --apply to fail against a non-functional agent binary, got exit 0" >&2
            exit 1
          fi
          if [ "${status}" -eq 22 ]; then
            echo "expected an exit code other than 22 (EXIT_ROLLBACK_FAILURE): a valid .previous existed and the restore itself should have succeeded, only the upgrade attempt should have failed; got 22" >&2
            exit 1
          fi
          printf '%s' "${result}" | grep -oE '"exit_code":[0-9]+'
          printf '%s' "${result}" | grep -qi 'rolled back' \
            || { echo "expected the failure message to mention the automatic rollback" >&2; exit 1; }

          restored_sha256=$(sudo sha256sum /var/lib/lesta/agent/bin/lesta-agent | awk '{print $1}')
          if [ "${restored_sha256}" != "${s8_orig_sha256}" ]; then
            echo "expected the live binary to be restored to the original sha256 ${s8_orig_sha256} after rollback, got ${restored_sha256}" >&2
            exit 1
          fi
          echo "rollback confirmed: live binary restored to ${restored_sha256}"

      - name: "Scenario 8: restore the committed manifest/binary and confirm the rolled-back binary is genuinely healthy via a real subsequent apply"
        run: |
          git checkout -- .install/services/node-health/manifest.json agent/dist/lesta-agent-linux-amd64
          result=$(sudo sh .install/services/nginx/install.sh --apply --yes --web-server nginx 2>/tmp/scenario8-followup-stderr.log)
          status=$?
          echo "${result}"
          echo "--- stderr log ---"
          cat /tmp/scenario8-followup-stderr.log || true
          if [ "${status}" -ne 0 ]; then
            echo "expected exit 0 (EXIT_OK): the rolled-back binary should pass its own self-test cleanly, got exit ${status}" >&2
            exit 1
          fi
          printf '%s' "${result}" | grep -q '"status":"applied"' \
            || { echo "expected the result body to contain \"status\":\"applied\"" >&2; exit 1; }

      - name: "Scenario 8 cleanup: ensure no stray .previous is left behind"
        run: sudo rm -f /var/lib/lesta/agent/bin/lesta-agent.previous

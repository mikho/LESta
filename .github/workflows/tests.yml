name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

  agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false

      - name: Check formatting
        working-directory: agent
        run: test -z "$(gofmt -l .)"

      - name: Vet
        working-directory: agent
        run: go vet ./...

      - name: Test (nginx/pebble not installed yet; real-capability suite self-skips)
        working-directory: agent
        run: go test ./...

      - name: Install nginx
        run: sudo apt-get update && sudo apt-get install -y nginx

      - name: Install bind9
        run: sudo apt-get update && sudo apt-get install -y bind9 bind9-utils

      - name: Install apache2
        run: sudo apt-get update && sudo apt-get install -y apache2

      - name: Install Pebble
        # Let's Encrypt's own official ACME v2 test server (never a live
        # third-party service), matching this job's own real-binary
        # precedent for nginx/bind9/apache2. Unpinned: this Go-side test
        # hand-rolls its own JSON decoding into plain Go structs, which
        # tolerates newer Pebble versions' additional challenge types
        # (dns-account-01, dns-persist-01) without issue -- unlike the
        # separate PHP-side Pebble tests (acmephp/core-based, in the `ci`
        # job... not yet wired into CI -- see this phase's own final
        # report), which need a specific older Pebble version pinned due to
        # a real acmephp/core compatibility gap with those newer types.
        run: go install github.com/letsencrypt/pebble/v2/cmd/pebble@latest

      - name: Test (fake, real nginx, real bind9, real apache, and real Pebble-backed ACME capability, nothing skips)
        working-directory: agent
        run: go test ./...

  installer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false

      - name: Report runner platform (diagnostic only)
        run: cat /etc/os-release

      - name: ShellCheck the installer
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          # SC1091 excluded: it fires for the lib/*.sh files install.sh
          # sources (only resolvable with -x run from install.sh's own
          # directory, not meaningful checked from the repo root) and for
          # preflight.sh's read of /etc/os-release (a real runtime path that
          # never exists in this repository). Verified separately (locally,
          # with -x and the correct working directory) that following those
          # sources turns up nothing SC1091 was hiding.
          shellcheck --shell=sh --severity=style -e SC1091 .install/lib/*.sh .install/services/nginx/install.sh .install/services/bind9/install.sh .install/services/apache/install.sh

      - name: Prepare the runner as a bare nginx-profile node
        run: |
          # GitHub-hosted runner images are pre-provisioned, not bare: they
          # ship apache2 (which install.sh's own conflicting-package
          # preflight check correctly rejects) and no nginx.conf include
          # line at all. This step performs exactly the two things
          # nginx/README.md's "Manual prerequisite" section documents an
          # operator must do by hand before their first --apply: install
          # nginx, then add the required include line. install.sh itself
          # never touches either.
          sudo systemctl stop apache2 2>/dev/null || true
          sudo apt-get purge -y apache2 apache2-bin apache2-data apache2-utils lighttpd 2>/dev/null || true
          sudo apt-get autoremove -y
          sudo apt-get update
          sudo apt-get install -y nginx
          if ! grep -F "include" /etc/nginx/nginx.conf | grep -F "/etc/nginx/lesta.d/*.conf" >/dev/null 2>&1; then
            sudo sed -i '/^http {/a\    include /etc/nginx/lesta.d/*.conf;' /etc/nginx/nginx.conf
          fi
          cat /etc/nginx/nginx.conf

      - name: Dry-run against a real Ubuntu host (must mutate nothing)
        run: sudo sh .install/services/nginx/install.sh --dry-run --web-server nginx

      - name: Apply (real mutation on this disposable CI runner)
        run: sudo sh .install/services/nginx/install.sh --apply --web-server nginx --yes

      - name: Re-apply (idempotent rerun must still succeed)
        run: sudo sh .install/services/nginx/install.sh --apply --web-server nginx --yes

      - name: Standalone Apache installer coverage (help/version/dry-run/argument validation only; a real --apply here would conflict with nginx already owning 80/443 in this same job)
        run: |
          sh .install/services/apache/install.sh --help
          sh .install/services/apache/install.sh --version

          # --dry-run (default --web-profile apache): nginx already owns
          # 80/443 and is already installed on this runner, so apache's own
          # preflight (port-free + conflicting-package checks) must
          # correctly detect the real conflict and fail closed, never
          # proceed to would_change.
          set +e
          sudo sh .install/services/apache/install.sh --dry-run
          status=$?
          set -e
          if [ "${status}" -ne 12 ]; then
            echo "expected --dry-run (default apache profile) to fail preflight with exit 12 (EXIT_PREFLIGHT_CONFLICT) against a node where nginx already owns 80/443, got exit ${status}" >&2
            exit 1
          fi

          # --dry-run --web-profile both: skips the port/package preflight
          # entirely (nginx legitimately owns 80/443 in this profile), but
          # apache2 itself is never installed in this job, so the
          # apache2.conf include-line precondition correctly fails instead.
          set +e
          sudo sh .install/services/apache/install.sh --dry-run --web-profile both
          status=$?
          set -e
          if [ "${status}" -ne 12 ]; then
            echo "expected --dry-run --web-profile both to fail preflight with exit 12 (EXIT_PREFLIGHT_CONFLICT, missing apache2.conf) since apache2 is never installed in this job, got exit ${status}" >&2
            exit 1
          fi

          # Invalid invocations: pure argument validation, no infra needed.
          set +e
          sh .install/services/apache/install.sh
          status=$?
          set -e
          if [ "${status}" -ne 10 ]; then
            echo "expected a no-arguments invocation to fail with exit 10 (EXIT_INVALID_INVOCATION), got exit ${status}" >&2
            exit 1
          fi

          set +e
          sh .install/services/apache/install.sh --dry-run --web-profile bogus
          status=$?
          set -e
          if [ "${status}" -ne 10 ]; then
            echo "expected an invalid --web-profile value to fail with exit 10 (EXIT_INVALID_INVOCATION), got exit ${status}" >&2
            exit 1
          fi

      - name: Prepare the runner for bind9
        run: |
          # Mirrors the nginx prep step above, exactly: install the
          # package, then add the required include line to
          # /etc/bind/named.conf ITSELF (not named.conf.local -- see
          # bind9/README.md's "Manual prerequisite" section for why).
          # install.sh itself never touches named.conf.
          sudo apt-get update
          sudo apt-get install -y bind9 bind9-utils
          if ! grep -F "include" /etc/bind/named.conf | grep -F "/etc/bind/lesta.d/*.conf" >/dev/null 2>&1; then
            sudo sed -i '$a\include "/etc/bind/lesta.d/*.conf";' /etc/bind/named.conf
          fi
          cat /etc/bind/named.conf

      - name: Dry-run bind9 against a real Ubuntu host (must mutate nothing)
        run: sudo sh .install/services/bind9/install.sh --dry-run

      - name: Apply bind9 (real mutation on this disposable CI runner)
        run: sudo sh .install/services/bind9/install.sh --apply --yes

      - name: Diagnose bind9 apply failure (only runs if the step above failed)
        if: failure()
        run: |
          sudo systemctl status named --no-pager || true
          echo "--- full named journal, grepped for the self-test zone ---"
          sudo journalctl -u named --no-pager | grep -i selftest || true
          echo "--- last 40 lines of the named journal, unfiltered ---"
          sudo journalctl -u named --no-pager -n 40 || true
          echo "--- AppArmor status ---"
          sudo aa-status || true
          echo "--- kernel log, grepped for apparmor denials against named ---"
          sudo dmesg 2>/dev/null | grep -i apparmor | grep -i named || true
          sudo journalctl -k --no-pager | grep -iE 'apparmor.*(denied|named)' || true
          echo "--- zone data directory ownership/permissions ---"
          sudo ls -laR /var/lib/lesta/bind/zones 2>&1 || true
          echo "--- full path walk (namei), the definitive tool for this bug class ---"
          sudo namei -l /var/lib/lesta/bind/zones/*/generations/1/zone.db 2>&1 || true
          echo "--- bind user's actual group memberships ---"
          id bind || true
          echo "--- named.service unit, checking for sandboxing directives ---"
          systemctl cat named 2>&1 || true
          echo "--- /etc/default/named (checking for a chroot -t flag) ---"
          sudo cat /etc/default/named 2>&1 || true
          echo "--- direct traversal test AS the bind user, bypassing all speculation ---"
          sudo -u bind test -x /var/lib/lesta/bind && echo "bind CAN exec/traverse /var/lib/lesta/bind" || echo "bind CANNOT exec/traverse /var/lib/lesta/bind"
          sudo -u bind ls -la /var/lib/lesta/bind/zones 2>&1 || true
          echo "--- full AppArmor profile for named (checking for a silent/unlogged deny rule) ---"
          sudo cat /etc/apparmor.d/usr.sbin.named 2>&1 || true
          sudo cat /etc/apparmor.d/local/usr.sbin.named 2>&1 || true
          echo "--- ss :53 ---"
          sudo ss -H -tlnp | grep ':53 ' || true
          sudo ss -H -ulnp | grep ':53 ' || true

      - name: Verify nginx's ports are still open after bind9's apply
        run: |
          # This is the actual regression proof for the whole phase: bind9's
          # own firewall phase must union its ports with nginx's already-
          # registered ports, never replace the shared nftables table
          # outright (see lib/firewall.sh's own top comment).
          sudo nft list table inet lesta | tee /tmp/lesta-nft.txt
          curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:80/
          # A bare `apt-get install nginx` never configures an SSL vhost, so
          # nginx genuinely never binds 443 in this job regardless of
          # bind9's own changes -- there was never a live listener to
          # regression-check here. The real, always-true guarantee this
          # step exists to prove is that bind9's firewall phase didn't
          # drop nginx's port from the shared nftables table, checked
          # directly against the listing above instead.
          grep -q '443' /tmp/lesta-nft.txt && echo "443/tcp still allowed in the firewall table"

      - name: Re-apply bind9 (idempotent rerun must still succeed)
        run: sudo sh .install/services/bind9/install.sh --apply --yes

      - name: Re-verify nginx's ports are still open after bind9's second apply
        run: |
          sudo nft list table inet lesta | tee /tmp/lesta-nft-2.txt
          curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:80/
          grep -q '443' /tmp/lesta-nft-2.txt && echo "443/tcp still allowed in the firewall table"

      - name: Relax AppArmor for named before running the disposable-harness tests
        run: |
          # The Go test suite's own disposable bind9 harness
          # (agent/internal/capability/bind9/harness_test.go) points a real
          # named at a config under t.TempDir() (/tmp/...), a path outside
          # the production AppArmor profile's allow-list -- confirmed
          # directly via a kernel audit denial naming that exact test's own
          # tmp path. Production named (confined to /etc/bind, /var/lib/
          # bind, /var/cache/bind, and now /var/lib/lesta/bind) should stay
          # fully enforced; only this disposable, thrown-away CI runner's
          # test run needs the relaxation, so this never weakens what a
          # real node actually enforces.
          # apparmor_parser directly, not aa-complain: aa-complain's Python
          # tooling scans the entire /etc/apparmor.d/ directory and this
          # runner image ships two overlapping, pre-existing, unrelated
          # profiles for Microsoft Edge that make that whole-directory scan
          # error out before it ever reaches named. apparmor_parser -C
          # operates only on the one file given to it.
          sudo apparmor_parser -r -C /etc/apparmor.d/usr.sbin.named

      - name: Real-capability agent tests against the installer-produced state
        working-directory: agent
        run: go test ./...

      - name: Diagnose agent test failure (only runs if the step above failed)
        if: failure()
        run: |
          echo "--- kernel log, grepped for any apparmor denial against named ---"
          sudo journalctl -k --no-pager | grep -i 'apparmor.*named' | tail -40 || true
          echo "--- is a real system named currently active? ---"
          sudo systemctl status named --no-pager || true
          echo "--- what's listening on 53 right now ---"
          sudo ss -H -tlnp | grep ':53 ' || true
          sudo ss -H -ulnp | grep ':53 ' || true

  installer-both-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false

      - name: Prepare the runner as a bare node (nginx + apache2 installed and configured, apache2 stopped so nginx can claim port 80 first)
        run: |
          # Mirrors the "installer" job's own "prepare as a bare node"
          # pattern, extended to both web server packages: this profile
          # needs BOTH nginx.conf's and apache2.conf's own include lines
          # satisfied as manual operator prerequisites before either
          # install.sh invocation below, exactly like the "installer" job's
          # own nginx/bind9 prep steps already do one at a time.
          #
          # apache2 is stopped (not purged) right after its own prereqs are
          # satisfied: its package postinst auto-starts it bound to the
          # stock port 80, which would otherwise collide with nginx's own
          # preflight/bind moments later in this same job. apache/install.sh
          # itself (invoked via nginx/install.sh's own --web-server both
          # delegation) reconfigures and restarts apache2 on its real
          # loopback port (8080) once nginx already owns 80.
          sudo systemctl stop nginx apache2 2>/dev/null || true
          sudo apt-get purge -y nginx nginx-common nginx-core apache2 apache2-bin apache2-data apache2-utils lighttpd bind9 bind9-utils 2>/dev/null || true
          sudo apt-get autoremove -y
          sudo apt-get update

          sudo apt-get install -y nginx
          if ! grep -F "include" /etc/nginx/nginx.conf | grep -F "/etc/nginx/lesta.d/*.conf" >/dev/null 2>&1; then
            sudo sed -i '/^http {/a\    include /etc/nginx/lesta.d/*.conf;' /etc/nginx/nginx.conf
          fi
          cat /etc/nginx/nginx.conf

          sudo apt-get install -y apache2
          if ! grep -F "Include" /etc/apache2/apache2.conf | grep -F "/etc/apache2/lesta.d/*.conf" >/dev/null 2>&1; then
            printf '\nIncludeOptional /etc/apache2/lesta.d/*.conf\n' | sudo tee -a /etc/apache2/apache2.conf >/dev/null
          fi
          cat /etc/apache2/apache2.conf
          sudo systemctl stop apache2

      - name: Dry-run nginx --web-server both (must mutate nothing)
        run: sudo sh .install/services/nginx/install.sh --dry-run --web-server both

      - name: Apply nginx --web-server both (real mutation on this disposable CI runner; installs and health-checks nginx, then delegates to apache/install.sh --web-profile both)
        run: sudo sh .install/services/nginx/install.sh --apply --yes --web-server both

      - name: Re-apply nginx --web-server both (idempotent rerun must still succeed, covering the orchestration path itself, not just each leaf script alone)
        run: sudo sh .install/services/nginx/install.sh --apply --yes --web-server both

      - name: Verify both nginx and apache2 are active
        run: |
          sudo systemctl is-active nginx
          sudo systemctl is-active apache2

      - name: Verify /etc/lesta/web-profile contains 'both'
        run: |
          sudo cat /etc/lesta/web-profile
          [ "$(sudo cat /etc/lesta/web-profile)" = "both" ]

      - name: Verify apache2 is listening on its loopback backend port, never on public 80
        run: |
          sudo ss -H -tlnp | grep ':8080 ' | grep -q apache2
          ! sudo ss -H -tlnp | grep ':80 ' | grep -q apache2
          curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:80/

      - name: Real-capability agent tests against the installer-produced both-profile system (exercises apacheProductionConfig()'s port-8080 branch against a genuinely both-profiled node)
        working-directory: agent
        run: go test ./...

      - name: Diagnose a failure in this job (only runs if a step above failed)
        if: failure()
        run: |
          echo "--- systemctl status nginx ---"
          sudo systemctl status nginx --no-pager || true
          echo "--- systemctl status apache2 ---"
          sudo systemctl status apache2 --no-pager || true
          echo "--- ss -tlnp (80 and 8080) ---"
          sudo ss -H -tlnp | grep -E ':(80|8080) ' || true
          echo "--- /etc/lesta/web-profile ---"
          sudo cat /etc/lesta/web-profile 2>&1 || true
          echo "--- apache2 error log ---"
          sudo tail -n 60 /var/log/apache2/error.log 2>&1 || true
